event-options {
    policy LDP_DOWN {
        events rpd_ldp_sessiondown;
        within 60 {
            trigger on 1;
        }
        then {
            execute-commands {
                commands {
                    "show ldp neighbor";
                    "show isis adjacency";
                    "show route table mpls.0";
                    "show ldp session";
                    "show route protocol isis range 192.168.1.0/24 | no-more";
                }
                user-name admin;
                output-filename VAR_TMP;
                destination VAR_TMP;
                output-format text;
            }
        }
    }
    destinations {
        VAR_TMP {
            archive-sites {
                /var/tmp;
            }
        }
    }
}
policy-options {
    prefix-list BGP-NEIGHBORS {
        apply-path "protocols bgp group <*> neighbor <*>";
    }
    prefix-list DOCKER_MGMT {
        10.0.0.0/24;
    }
    prefix-list NTP-SERVERS {
        apply-path "system ntp server <*>";
    }
    prefix-list RI-BGP-NEIGHBORS {
        apply-path "routing-instances <*> protocols bgp group <*> neighbor <*>";
    }
    policy-statement C-RP-EXPORT {
        term 1 {
            from {
                protocol bgp;
                route-filter 10.65.13.254/32 exact;
            }
            then accept;
        }
    }
    policy-statement C2-v6-rewrite {
        term 1 {
            from {
                family inet6;
                protocol bgp;
                neighbor 172.16.2.2;
            }
            then {
                community set C2;
                next-hop 2000:172:16:2::2;
                accept;
            }
        }
        term 2 {
            from {
                family inet;
                protocol bgp;
            }
            then {
                community set C2;
            }
        }
    }
    policy-statement DEFAULT_ONLY {
        term 1 {
            from {
                family inet6;
                route-filter ::/0 exact;
            }
            then {
                community delete wildcard-all;
                next-hop 2000:172:16:2::1;
                accept;
            }
        }
        term 2 {
            from {
                route-filter 0.0.0.0/0 exact;
            }
            then {
                community delete wildcard-all;
                accept;
            }
        }
        term 3 {
            then reject;
        }
    }
    policy-statement DO-Rewrite {
        term 1 {
            from {
                family inet-vpn;
                community DIGITAL-OCEAN-R;
            }
            then {
                community delete DIGITAL-OCEAN-R;
                community set DIGITAL-OCEAN-L;
                accept;
            }
        }
    }
    policy-statement L1-To-L2-Loopbacks {
        term not-my-own {
            from {
                route-filter 192.168.1.7/32 exact;
            }
            to level 1;
            then reject;
        }
        term 1 {
            from {
                family inet;
                route-filter 192.168.1.0/29 longer;
                route-filter 192.168.1.101/32 exact;
                route-filter 192.168.1.102/32 exact;
                route-filter 192.168.1.8/31 longer;
            }
            then accept;
        }
        term 2 {
            from {
                family inet6;
                route-filter 192::0/125 longer;
                route-filter 192::8/127 longer;
            }
            then accept;
        }
        term 3 {
            then reject;
        }
    }
    policy-statement NO-CUST-ADVERTISE {
        term 1 {
            from {
                protocol bgp;
                as-path CUST;
            }
            then reject;
        }
    }
    policy-statement NO-TRANSIT {
        term 1 {
            from {
                protocol bgp;
                as-path [ 65001-PROVIDERS 65002-PROVIDERS PROVIDERS-DIRECT ];
            }
            then reject;
        }
    }
    policy-statement NT-SPOKE-EXPORT {
        term 1 {
            from protocol [ direct bgp ];
            then {
                community add NT-SPOKE;
                community add SHARED-DO-NT;
                accept;
            }
        }
    }
    policy-statement NT-SPOKE-IMPORT {
        term 1 {
            from {
                protocol bgp;
                community NT-HUB;
            }
            then accept;
        }
        term 2 {
            from {
                protocol [ direct ospf ];
                community SHARED-DO-NT;
            }
            then accept;
        }
    }
    policy-statement OCEAN-EXPORT {
        term 1 {
            from protocol [ direct ospf ];
            then {
                community add DIGITAL-OCEAN;
                community add SHARED-DO-NT;
                accept;
            }
        }
    }
    policy-statement OCEAN-IMPORT {
        term 1 {
            from {
                protocol bgp;
                community DIGITAL-OCEAN;
            }
            then accept;
        }
        term 2 {
            from {
                protocol bgp;
                community SHARED-DO-NT;
                route-type external;
            }
            then accept;
        }
        term 3 {
            from {
                protocol direct;
                community SHARED-DO-NT;
            }
            then accept;
        }
    }
    policy-statement U1-Pref {
        term 1 {
            from {
                protocol bgp;
                as-path U1;
            }
            then {
                local-preference 200;
                accept;
            }
        }
    }
    policy-statement bgp-to-ospf {
        term 1 {
            from protocol bgp;
            then accept;
        }
    }
    policy-statement nh-self {
        term 1 {
            from {
                family inet;
                protocol bgp;
                as-path [ C2 U1 U2 ];
            }
            then {
                next-hop self;
            }
        }
        term 2 {
            from {
                family inet6;
                protocol bgp;
                as-path [ 65002-PROVIDERS C2 ];
            }
            then {
                next-hop self;
                accept;
            }
        }
        term 3 {
            from family inet-vpn;
            then accept;
        }
    }
    policy-statement nh-self-cbgp {
        term 1 {
            from {
                family inet;
                protocol bgp;
                as-path [ C2 C1 U3 ];
            }
            then {
                next-hop self;
            }
        }
        term 2 {
            from {
                family inet6;
                protocol bgp;
                as-path [ C2 C1 U3 ];
            }
            then {
                next-hop 192::7;
                accept;
            }
        }
        term 3 {
            from family inet-vpn;
            then {
                next-hop self;
                accept;
            }
        }
    }
    policy-statement rr_to_inet3_policy {
        term 1 {
            from {
                instance master;
                protocol isis;
                route-filter 192.168.1.101/32 exact;
                route-filter 192.168.1.102/32 exact;
            }
            to rib inet.3;
            then accept;
        }
        term 2 {
            from instance master;
            to rib inet.3;
            then reject;
        }
    }
    policy-statement self_to_inet3 {
        term 1 {
            from {
                instance master;
                route-filter 192.168.1.7/32 exact;
            }
            to rib inet.3;
            then accept;
        }
        term 2 {
            from instance master;
            to rib inet.3;
            then reject;
        }
    }
    policy-statement standard_deny_import {
        term 1 {
            from {
                protocol bgp;
                route-filter 0.0.0.0/0 through 0.0.0.0/32;
            }
            then reject;
        }
        term 2 {
            from {
                route-filter 0.0.0.0/0 prefix-length-range /0-/7;
                route-filter 0.0.0.0/0 prefix-length-range /25-/31;
            }
            then accept;
        }
        term 3 {
            from community SPECIAL;
            then {
                next-hop discard;
                accept;
            }
        }
    }
    policy-statement strip-communities {
        term 1 {
            from community wildcard-all;
            then {
                community delete wildcard-all;
                accept;
            }
        }
    }
    community C1 members 999:65101;
    community C2 members 999:65102;
    community DIGITAL-OCEAN members target:999:100;
    community DIGITAL-OCEAN-L members target:999:100;
    community DIGITAL-OCEAN-R members target:999:101;
    community NT-HUB members target:999:200;
    community NT-SPOKE members target:999:201;
    community SHARED-DO-NT members target:999:501;
    community SPECIAL members .:606;
    community U1 members 999:2389;
    community U2 members 999:701;
    community U3 members 999:7311;
    community no-export members no-export;
    community wildcard-all members *:*;
    as-path CUST "6510. .*";
    as-path C2 "65102 .*";
    as-path U2 "701 .*";
    as-path C1 "65101 .*";
    as-path U1 "65002 23\.89 .*";
    as-path U3 "7311 .*";
    as-path 65001-PROVIDERS "65001 (23\.89|701|7311|13335)( .*)?";
    as-path 65002-PROVIDERS "65002 (23\.89|701|7311|13335)( .*)?";
    as-path PROVIDERS-DIRECT "(23\.89|701|7311|13335)( .*)?";
}
class-of-service {
    classifiers {
        dscp JNCIE_DSCP {
            forwarding-class BE {
                loss-priority low code-points 000000;
            }
            forwarding-class EF {
                loss-priority high code-points 101110;
            }
            forwarding-class VPN {
                loss-priority low code-points 000010;
            }
            forwarding-class VPN-PRI {
                loss-priority low code-points 000110;
            }
        }
        exp JNCIE_EXP {
            forwarding-class BE {
                loss-priority low code-points 000;
            }
            forwarding-class EF {
                loss-priority high code-points 110;
            }
            forwarding-class VPN {
                loss-priority low code-points 010;
            }
            forwarding-class VPN-PRI {
                loss-priority low code-points 011;
            }
        }
    }
    forwarding-classes {
        class BE queue-num 0;
        class VPN queue-num 1;
        class VPN-PRI queue-num 2;
        class EF queue-num 3;
    }
    interfaces {
        ge-0/0/0 {
            scheduler-map JNCIE_MAP;
            unit 0 {
                classifiers {
                    dscp JNCIE_DSCP;
                    exp JNCIE_EXP;
                }
                rewrite-rules {
                    dscp JNCIE_DSCP_RW;
                    exp JNCIE_EXP_RW;
                }
            }
        }
        ge-0/0/4 {
            scheduler-map JNCIE_MAP;
            unit 0 {
                classifiers {
                    dscp JNCIE_DSCP;
                    exp JNCIE_EXP;
                }
                rewrite-rules {
                    dscp JNCIE_DSCP_RW;
                    exp JNCIE_EXP_RW;
                }
            }
        }
        ge-0/0/9 {
            scheduler-map JNCIE_MAP;
            unit 0 {
                classifiers {
                    dscp JNCIE_DSCP;
                    exp JNCIE_EXP;
                }
                rewrite-rules {
                    dscp JNCIE_DSCP_RW;
                    exp JNCIE_EXP_RW;
                }
            }
        }
    }
    rewrite-rules {
        dscp JNCIE_DSCP_RW {
            forwarding-class BE {
                loss-priority low code-point 000000;
            }
            forwarding-class EF {
                loss-priority high code-point 101110;
            }
            forwarding-class VPN {
                loss-priority low code-point 000010;
            }
            forwarding-class VPN-PRI {
                loss-priority low code-point 000110;
            }
        }
        exp JNCIE_EXP_RW {
            forwarding-class BE {
                loss-priority low code-point 000;
            }
            forwarding-class EF {
                loss-priority high code-point 110;
            }
            forwarding-class VPN {
                loss-priority low code-point 010;
            }
            forwarding-class VPN-PRI {
                loss-priority low code-point 011;
            }
        }
    }
    scheduler-maps {
        JNCIE_MAP {
            forwarding-class BE scheduler be_sched;
            forwarding-class EF scheduler ef_sched;
            forwarding-class VPN scheduler vpn_sched;
            forwarding-class VPN-PRI scheduler vpn_pri_sched;
        }
    }
    schedulers {
        be_sched {
            transmit-rate {
                remainder;
            }
            priority low;
        }
        ef_sched {
            transmit-rate percent 20;
            buffer-size percent 20;
            priority high;
        }
        vpn_pri_sched {
            transmit-rate percent 30;
            buffer-size percent 30;
            priority medium-high;
        }
        vpn_sched {
            transmit-rate percent 30;
            buffer-size percent 30;
            priority medium-low;
        }
    }
}
firewall {
    family inet {
        filter protect_re {
            term 1 {
                from {
                    source-prefix-list {
                        DOCKER_MGMT;
                    }
                    protocol tcp;
                    destination-port [ ssh 830 ];
                }
                then {
                    count ssh_counter;
                    accept;
                }
            }
            term 2 {
                from {
                    source-address {
                        192.168.1.2/32;
                    }
                    source-prefix-list {
                        NTP-SERVERS;
                    }
                    protocol udp;
                    port ntp;
                }
                then {
                    count ntp_counter;
                    syslog;
                    accept;
                }
            }
            term 3 {
                from {
                    source-prefix-list {
                        BGP-NEIGHBORS;
                        RI-BGP-NEIGHBORS;
                    }
                    protocol tcp;
                    port bgp;
                }
                then {
                    count bgp_counter;
                    accept;
                }
            }
            term 4 {
                from {
                    source-address {
                        8.8.8.8/32;
                    }
                    protocol udp;
                    destination-port snmp;
                }
                then {
                    count snmp_counter;
                    accept;
                }
            }
            term 5 {
                from {
                    protocol ospf;
                }
                then {
                    count ospf_counter;
                    syslog;
                    accept;
                }
            }
            term 6 {
                from {
                    protocol rsvp;
                }
                then {
                    count rsvp_counter;
                    accept;
                }
            }
            term 7 {
                from {
                    protocol udp;
                    destination-port [ 8503 3503 ];
                }
                then {
                    count mpls_oam_counter;
                    accept;
                }
            }
            term 8 {
                from {
                    protocol udp;
                    destination-port [ 3784 3785 4784 ];
                }
                then {
                    count bfd_counter;
                    accept;
                }
            }
            term 9 {
                from {
                    protocol icmp;
                    icmp-type [ time-exceeded echo-reply echo-request ];
                }
                then {
                    count icmp_counter;
                    accept;
                }
            }
            term 10 {
                from {
                    protocol udp;
                    port 33434-33534;
                }
                then {
                    count traceroute_counter;
                    accept;
                }
            }
            term 11 {
                from {
                    protocol [ udp tcp ];
                    port 646;
                }
                then {
                    count ldp_counter;
                    accept;
                }
            }
            term 12 {
                from {
                    source-address {
                        8.8.8.8/32;
                    }
                    protocol tcp;
                    destination-port 54321;
                }
                then {
                    count grpc_count;
                    syslog;
                    accept;
                }
            }
            term 13 {
                from {
                    protocol [ pim igmp ];
                }
                then {
                    count mcast;
                    syslog;
                    accept;
                }
            }
            term 14 {
                then {
                    count discard;
                    syslog;
                    discard;
                }
            }
        }
    }
    family inet6 {
        filter protect_re_v6 {
            term 1 {
                from {
                    next-header ospf;
                }
                then {
                    count ospf_counter;
                    accept;
                }
            }
            term 2 {
                from {
                    next-header tcp;
                    port bgp;
                }
                then {
                    count bgp_counter_v6;
                    accept;
                }
            }
            term 3 {
                from {
                    next-header icmp6;
                    icmp-type [ neighbor-advertisement neighbor-solicit router-advertisement router-solicit inverse-neighbor-discovery-advertisement inverse-neighbor-discovery-solicitation echo-reply echo-request time-exceeded ];
                }
                then {
                    count icmp_v6_counter;
                    accept;
                }
            }
            term 4 {
                from {
                    next-header udp;
                    port 33434-33534;
                }
                then {
                    count traceroute_counter;
                    accept;
                }
            }
            term 5 {
                then {
                    syslog;
                    discard;
                }
            }
        }
    }
}
