class-of-service {
    classifiers {
        dscp JNCIE_DSCP {
            forwarding-class BE {
                loss-priority low code-points 000000;
            }
            forwarding-class EF {
                loss-priority high code-points 101110;
            }
            forwarding-class VPN {
                loss-priority low code-points 000010;
            }
            forwarding-class VPN-PRI {
                loss-priority low code-points 000110;
            }
        }
        exp JNCIE_EXP {
            forwarding-class BE {
                loss-priority low code-points 000;
            }
            forwarding-class EF {
                loss-priority high code-points 110;
            }
            forwarding-class VPN {
                loss-priority low code-points 010;
            }
            forwarding-class VPN-PRI {
                loss-priority low code-points 011;
            }
        }
    }
    forwarding-classes {
        class BE queue-num 0;
        class VPN queue-num 1;
        class VPN-PRI queue-num 2;
        class EF queue-num 3;
    }
    interfaces {
        ge-0/0/0 {
            scheduler-map JNCIE_MAP;
            unit 0 {
                classifiers {
                    dscp JNCIE_DSCP;
                    exp JNCIE_EXP;
                }
                rewrite-rules {
                    dscp JNCIE_DSCP_RW;
                    exp JNCIE_EXP_RW;
                }
            }
        }
        ge-0/0/1 {
            scheduler-map JNCIE_MAP;
