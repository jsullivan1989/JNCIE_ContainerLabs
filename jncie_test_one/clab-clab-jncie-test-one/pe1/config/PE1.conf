                    }
                    family mpls;
                }
            }
            ge-0/0/5 {
                unit 0 {
                    description "==== PE8 link to PE9 =====";
                    family inet {
                        address 10.10.10.14/31;
                    }
                    family mpls;
                }
            }
            ge-0/0/6 {
                unit 0 {
                    description "==== PE8 link to U2 =====";
                    family inet {
                        address 172.16.0.6/30;
                    }
                    family inet6 {
                        address 2001:172:16:0::6/126;
                    }
                }
            }
            ge-0/0/7 {
                unit 0 {
                    description "==== PE8 link to CE10 DIGITAL OCEAN L3VPN =====";
                    family inet {
                        address 172.16.100.6/30;
                    }
                }
            }
            lo0 {
                unit 1 {
                    family inet {
                        filter {
                            input protect_re;
                        }
                        address 192.168.1.8/32;
                    }
                    family iso {
                        address 49.0002.1921.6800.1008.00;
                    }
                    family inet6 {
                        filter {
                            input protect_re_v6;
                        }
                        address 192::8/128;
                    }
                    family mpls;
                }
            }
        }
        protocols {
            bgp {
                group ibgp {
                    type internal;
                    multihop;
                    local-address 192.168.1.8;
                    log-updown;
                    family inet {
                        unicast;
                    }
                    family inet-vpn {
                        unicast;
                    }
                    family inet6 {
                        unicast;
                    }
                    family l2vpn {
                        signaling;
                    }
                    family route-target {
                        advertise-default;
                    }
                    export nh-self;
                    neighbor 192.168.1.9;
                }
                group CBGP {
                    type external;
                    multihop;
                    local-address 192.168.1.8;
                    import DO-Rewrite;
                    family inet {
                        unicast;
                    }
                    family inet-vpn {
                        unicast;
                    }
                    family inet6 {
                        unicast;
                    }
                    family l2vpn {
                        signaling;
                    }
                    family evpn {
                        signaling;
                    }
                    export nh-self-cbgp;
                    neighbor 192.168.1.6 {
                        peer-as 65001;
                    }
                }
                group U2 {
                    type external;
                    multihop;
                    log-updown;
                    import [ standard-deny-import U2-v6-rewrite ];
                    family inet {
                        unicast;
                    }
                    family inet6 {
                        unicast;
                    }
                    export [ NO-TRANSIT AGG-EXPORT strip-communities ];
                    neighbor 172.16.0.5 {
                        peer-as 701;
                    }
                }
            }
            isis {
                interface ge-0/0/4.0 {
                    level 1 ipv6-unicast-metric 999999;
                    point-to-point;
                }
                interface ge-0/0/5.0 {
                    point-to-point;
                }
                interface lo0.1 {
                    passive;
                }
                level 1 {
                    authentication-key "$9$wa2oGzF/tpBk.Qn"; ## SECRET-DATA
                    authentication-type md5;
                    wide-metrics-only;
                    preference 18;
                }
                level 2 disable;
                export L1-To-L2-Loopbacks;
                reference-bandwidth 1g;
                ignore-attached-bit;
                topologies ipv6-unicast;
            }
            ldp {
                interface ge-0/0/4.0;
                interface ge-0/0/5.0;
                interface lo0.1;
            }
            mpls {
                admin-groups {
                    RED 0;
                    BLUE 1;
                    GREEN 2;
                }
                ipv6-tunneling;
                interface ge-0/0/4.0;
                interface ge-0/0/5.0;
            }
        }
        policy-options {
            prefix-list DOCKER_MGMT {
                10.0.0.0/24;
            }
            prefix-list LS-BGP-NEIGHBORS {
                apply-path "logical-systems <*> protocols bgp group <*> neighbor <*>";
            }
            prefix-list LS-NTP-SERVERS;
            prefix-list LS-RI-BGP-NEIGHBORS {
                apply-path "logical-systems <*> routing-instances <*> protocols bgp group <*> neighbor <*>";
            }
            policy-statement AGG-EXPORT {
                term 1 {
                    from {
                        family inet6;
                        route-filter 192::/16 exact;
                    }
                    then {
                        community delete wildcard-all;
                        next-hop 2001:172:16:0::6;
                        accept;
                    }
                }
                term 2 {
                    from {
                        route-filter 192.168.1.0/24 exact;
                    }
                    then {
                        community delete wildcard-all;
                        accept;
                    }
                }
            }
            policy-statement DO-Rewrite {
                term 1 {
                    from {
                        family inet-vpn;
                        community DIGITAL-OCEAN-L;
                    }
                    then {
                        community delete DIGITAL-OCEAN-L;
                        community set DIGITAL-OCEAN-R;
                        accept;
                    }
                }
            }
            policy-statement L1-To-L2-Loopbacks {
                term 1 {
                    from {
                        family inet;
                        level 1;
                        route-filter 192.168.1.8/31 longer;
                    }
                    to level 2;
                    then accept;
                }
                term 2 {
                    from {
                        family inet6;
                        level 1;
                        route-filter 192::8/127 longer;
                    }
                    to level 2;
                    then accept;
                }
                term 3 {
                    from level 1;
                    to level 2;
                    then reject;
                }
            }
            policy-statement NO-TRANSIT {
                term 1 {
                    from {
                        protocol bgp;
                        as-path [ 65001-PROVIDERS 65002-PROVIDERS PROVIDERS-DIRECT ];
                    }
                    then reject;
                }
            }
            policy-statement OCEAN-EXPORT {
                term 1 {
                    from protocol [ direct bgp ];
                    then {
                        community set DIGITAL-OCEAN-R;
                        accept;
                    }
                }
            }
            policy-statement OCEAN-IMPORT {
                term 1 {
                    from {
                        protocol bgp;
                        community DIGITAL-OCEAN-R;
                    }
                    then accept;
                }
            }
            policy-statement U2-v6-rewrite {
                term 1 {
                    from {
                        family inet6;
                        protocol bgp;
                        neighbor 172.16.0.5;
                    }
                    then {
                        community set U2;
                        next-hop 2001:172:16:0::5;
                        accept;
                    }
                }
                term 2 {
                    from {
                        family inet;
                        protocol bgp;
                    }
                    then {
                        community set U2;
                    }
                }
            }
            policy-statement nh-self {
                term 1 {
                    from {
                        family inet;
                        protocol bgp;
                        as-path U2;
                    }
                    then {
                        next-hop self;
                        accept;
                    }
                }
                term 2 {
                    from {
                        family inet6;
                        protocol bgp;
                        as-path U2;
                    }
                    then {
                        next-hop 192::8;
                        accept;
                    }
                }
            }
            policy-statement nh-self-cbgp {
                term 1 {
                    from {
                        family inet;
                        protocol bgp;
                        as-path [ U1 U2 ];
                    }
                    then {
                        next-hop self;
                        accept;
                    }
                }
                term 2 {
                    from {
                        family inet6;
                        protocol bgp;
                        as-path [ U1 U2 ];
                    }
                    then {
                        next-hop 192::8;
                        accept;
                    }
                }
                term 3 {
                    from family inet-vpn;
                    then {
                        next-hop self;
                        accept;
                    }
                }
            }
            policy-statement standard-deny-import {
                term 1 {
                    from {
                        protocol bgp;
                        route-filter 0.0.0.0/0 through 0.0.0.0/32;
                    }
                    then reject;
                }
                term 2 {
                    from {
                        route-filter 0.0.0.0/0 prefix-length-range /0-/7;
                        route-filter 0.0.0.0/0 prefix-length-range /25-/31;
                    }
                    then reject;
                }
                term 3 {
                    from community SPECIAL;
                    then {
                        next-hop discard;
                        accept;
                    }
                }
            }
            policy-statement standard_deny_import {
                term 1 {
                    from {
                        protocol bgp;
                        route-filter 0.0.0.0/0 through 0.0.0.0/32;
                    }
                    then reject;
                }
                term 2 {
                    from {
                        route-filter 0.0.0.0/0 prefix-length-range /0-/7;
                        route-filter 0.0.0.0/0 prefix-length-range /25-/31;
                    }
                    then reject;
                }
                term 3 {
                    from community SPECIAL;
                    then {
                        next-hop discard;
                        accept;
                    }
                }
            }
            policy-statement strip-communities {
                term 1 {
                    from {
                        family inet6;
                        protocol bgp;
                    }
                    then {
                        community delete wildcard-all;
                        next-hop 2001:172:16:0::6;
                        accept;
                    }
                }
                term 2 {
                    from {
                        family inet;
                        protocol bgp;
                    }
                    then {
                        community delete wildcard-all;
                        accept;
                    }
                }
            }
            community C1 members 999:65101;
            community C2 members 999:65102;
            community DIGITAL-OCEAN-L members target:999:100;
            community DIGITAL-OCEAN-R members target:999:101;
            community SPECIAL members .:606;
            community U1 members 999:2389;
            community U2 members 999:701;
            community U3 members 999:7311;
            community no-export members no-export;
            community wildcard-all members *:*;
            as-path U2 "701 .*";
            as-path U1 "23\.89 .*";
            as-path PROVIDERS-DIRECT "(23\.89|701|7311|13335)( .*)?";
            as-path 65001-PROVIDERS "65001 (23\.89|701|7311|13335)( .*)?";
            as-path 65002-PROVIDERS "65002 (23\.89|701|7311|13335)( .*)?";
        }
        routing-instances {
            DIGITAL-OCEAN {
                instance-type vrf;
                protocols {
                    bgp {
                        group To-DO {
                            type external;
                            log-updown;
                            neighbor 172.16.100.5 {
                                peer-as 65100;
                            }
                        }
                    }
                }
                interface ge-0/0/7.0;
                route-distinguisher 192.168.1.8:100;
                vrf-import OCEAN-IMPORT;
                vrf-export OCEAN-EXPORT;
            }
        }
        routing-options {
            rib inet6.0 {
                aggregate {
                    route 192::/16 discard;
                }
            }
            autonomous-system 65002;
            confederation 999 members [ 65001 65002 ];
            aggregate {
                route 192.168.1.0/24 discard;
            }
        }
        system {
            syslog {
                file firewall_log {
                    firewall any;
                }
            }
        }
        firewall {
            family inet {
                filter protect_re {
                    term 1 {
                        from {
                            source-prefix-list {
                                DOCKER_MGMT;
                            }
                            protocol tcp;
                            destination-port [ ssh 830 ];
                        }
                        then {
                            count ssh_counter;
                            accept;
                        }
                    }
                    term 2 {
                        from {
                            source-prefix-list {
                                LS-NTP-SERVERS;
                            }
                            protocol udp;
                            port ntp;
                        }
                        then {
                            count ntp_counter;
                            accept;
                        }
                    }
                    term 3 {
                        from {
                            source-prefix-list {
                                LS-BGP-NEIGHBORS;
                                LS-RI-BGP-NEIGHBORS;
                            }
                            protocol tcp;
                            port bgp;
                        }
                        then {
                            count bgp_counter;
                            accept;
                        }
                    }
                    term 4 {
                        from {
                            source-address {
                                8.8.8.8/32;
                            }
                            protocol udp;
                            destination-port snmp;
                        }
                        then {
                            count snmp_counter;
                            accept;
                        }
                    }
                    term 5 {
                        from {
                            protocol ospf;
                        }
                        then {
                            count ospf_counter;
                            accept;
                        }
                    }
                    term 6 {
                        from {
                            protocol rsvp;
                        }
                        then {
                            count rsvp_counter;
                            accept;
                        }
                    }
                    term 7 {
                        from {
                            protocol udp;
                            destination-port [ 8503 3503 ];
                        }
                        then {
                            count mpls_oam_counter;
                            accept;
                        }
                    }
                    term 8 {
                        from {
                            protocol udp;
                            destination-port [ 3784 3785 4784 ];
                        }
                        then {
                            count bfd_counter;
                            accept;
                        }
                    }
                    term 9 {
                        from {
                            protocol icmp;
                            icmp-type [ time-exceeded echo-reply echo-request ];
                        }
                        then {
                            count icmp_counter;
                            accept;
                        }
                    }
                    term 10 {
                        from {
                            protocol udp;
                            port 33434-33534;
                        }
                        then {
                            count traceroute_counter;
                            accept;
                        }
                    }
                    term 11 {
                        from {
                            protocol [ udp tcp ];
                            port 646;
                        }
                        then {
                            count ldp_counter;
                            accept;
                        }
                    }
                    term 12 {
                        from {
                            source-address {
                                8.8.8.8/32;
                            }
                            protocol tcp;
                            destination-port 54321;
                        }
                        then {
                            count grpc_count;
                            accept;
                        }
                    }
                    term 13 {
                        then {
                            count discard_counter;
                            discard;
                        }
                    }
                }
            }
            family inet6 {
                filter protect_re_v6 {
                    term 1 {
                        from {
                            next-header ospf;
                        }
                        then {
                            count ospf_counter;
                            accept;
                        }
                    }
                    term 2 {
                        from {
                            next-header tcp;
                            port bgp;
                        }
                        then {
                            count bgp_counter_v6;
                            accept;
                        }
                    }
                    term 3 {
                        from {
                            next-header icmp6;
                            icmp-type [ neighbor-advertisement neighbor-solicit router-advertisement router-solicit inverse-neighbor-discovery-advertisement inverse-neighbor-discovery-solicitation echo-reply echo-request time-exceeded ];
                        }
                        then {
                            count icmp_v6_counter;
                            accept;
                        }
                    }
                    term 4 {
                        from {
                            next-header udp;
                            port 33434-33534;
                        }
                        then {
                            count traceroute_counter;
                            accept;
                        }
                    }
                    term 5 {
                        then discard;
                    }
                }
            }
        }
    }
}
