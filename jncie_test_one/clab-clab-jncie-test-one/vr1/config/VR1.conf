policy-options {
    policy-statement ASN_999_leak_inet0 {
        term 1 {
            from {
                rib U3.inet.3;
                route-filter 192.168.24.0/24 prefix-length-range /32-/32;
            }
            to rib U3.inet.0;
            then accept;
        }
        term 2 {
            from rib U3.inet.3;
            to rib U3.inet.0;
            then reject;
        }
    }
    policy-statement CUSTOMER1-EXPORT {
        term 1 {
            from {
                family inet;
                protocol direct;
                interface lo0.5;
                route-filter 10.1.1.0/24 prefix-length-range /32-/32;
            }
            then accept;
