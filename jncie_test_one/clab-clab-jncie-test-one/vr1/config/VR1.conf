                interface lt-0/0/0.3;
            }
        }
        policy-options {
            policy-statement ASN_999_leak_inet0_RR {
                term 1 {
                    from {
                        rib inet.3;
                        route-filter 192.168.24.0/24 prefix-length-range /32-/32;
                    }
                    to rib inet.0;
                    then accept;
                }
                term 2 {
                    from rib inet.3;
                    to rib inet.0;
                    then reject;
                }
            }
            policy-statement U3-RR-loop-leak-inet3 {
                term 1 {
                    from {
                        protocol direct;
                        rib inet.0;
                        route-filter 198.1.1.1/32 exact;
                    }
                    to rib inet.3;
                    then accept;
                }
                term 2 {
                    from rib inet.0;
                    to rib inet.3;
                    then reject;
                }
            }
            policy-statement nh-self {
                term 1 {
                    from protocol bgp;
                    then {
                        next-hop self;
                        accept;
                    }
                }
            }
        }
        routing-options {
            interface-routes {
                rib-group inet U3-RR-Self-Inet3;
            }
            autonomous-system 7311;
            rib-groups {
                U3-RR-Self-Inet3 {
                    import-rib [ inet.0 inet.3 ];
                    import-policy U3-RR-loop-leak-inet3;
                }
                AS999_to_inet0_RR {
                    import-rib [ inet.3 inet.0 ];
