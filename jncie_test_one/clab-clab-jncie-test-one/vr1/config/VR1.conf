            }
            then accept;
        }
        term 2 {
            from {
                protocol direct;
                route-filter 10.65.67.0/24 exact;
            }
            then accept;
        }
    }
    policy-statement U3-Export {
        term special-v4 {
            from {
                route-filter 33.33.33.4/32 exact;
            }
            then {
                community set SPECIAL;
                accept;
            }
        }
        term 1 {
            from {
                family inet;
                protocol direct;
