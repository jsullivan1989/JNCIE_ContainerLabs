event-options {
    policy SNMP_LINK_DOWN {
        events snmp_trap_link_down;
        within 60 {
            trigger after 2;
        }
        attributes-match {
            snmp_trap_link_down.interface-name matches ge-0/0/0*;
        }
        then {
            execute-commands {
                commands {
                    "show interfaces terse";
                }
                user-name admin;
                output-filename snmp_link_down_jncie.txt;
                destination local;
                output-format text;
            }
            event-script if-flap.slax {
                user-name admin;
            }
        }
    }
    event-script {
        file if-flap.slax;
    }
    destinations {
        local {
            archive-sites {
                /var/tmp;
            }
        }
    }
}
policy-options {
    prefix-list BGP-NEIGHBORS {
        apply-path "protocols bgp group <*> neighbor <*>";
    }
    prefix-list DOCKER_MGMT {
        10.0.0.0/24;
    }
    prefix-list NTP-SERVERS {
        apply-path "system ntp server <*>";
    }
    prefix-list RI-BGP-NEIGHBORS {
        apply-path "routing-instances <*> protocols bgp group <*> neighbor <*>";
    }
    policy-statement ADV-BGP-LU {
        term 1 {
            from {
                rib inet.3;
                route-filter 192.168.1.2/32 exact;
                route-filter 192.168.1.101/32 exact;
            }
            then accept;
        }
    }
    policy-statement AGG-EXPORT {
        term 2 {
            from {
                route-filter 192.168.1.0/24 exact;
            }
            then {
                community delete wildcard-all;
                accept;
            }
        }
    }
    policy-statement AGG-EXPORT-v6 {
        term 1 {
            from {
                family inet6;
                route-filter 192::/16 exact;
            }
            then {
                community delete wildcard-all;
                accept;
            }
        }
    }
    policy-statement C-RP-EXPORT {
        term 1 {
            from {
                protocol direct;
                route-filter 10.65.13.254/32 exact;
            }
            then accept;
        }
    }
    policy-statement INET_0_To_NT_Hub {
        term 1 {
            from protocol direct;
            then accept;
        }
        term 2 {
            from {
                protocol bgp;
                route-filter 8.8.8.0/24 exact;
            }
            then accept;
        }
        term 3 {
            then reject;
        }
    }
    policy-statement L1-To-L2-Loopbacks {
        term 1 {
            from {
                family inet;
                route-filter 192.168.1.0/29 longer;
                route-filter 192.168.1.101/32 exact;
                route-filter 192.168.1.102/32 exact;
                route-filter 192.168.1.8/31 longer;
            }
            then accept;
        }
        term 2 {
            from {
                family inet6;
                route-filter 192::0/125 longer;
                route-filter 192::8/127 longer;
            }
            then accept;
        }
        term 3 {
            then reject;
        }
    }
    policy-statement NO-TRANSIT {
        term 1 {
            from {
                protocol bgp;
                as-path [ 65001-PROVIDERS 65002-PROVIDERS PROVIDERS-DIRECT ];
            }
            then reject;
        }
    }
    policy-statement NT-HUB-EXPORT {
        term 1 {
            from {
                protocol [ direct bgp ];
                route-filter 10.65.0.0/16 orlonger;
                route-filter 172.65.0.0/16 orlonger;
            }
            then {
                community set NT-HUB;
                accept;
            }
        }
        term 2 {
            from {
                protocol static;
                route-filter 0.0.0.0/0 exact;
            }
            then {
                community set NT-HUB;
                accept;
            }
        }
    }
    policy-statement NT-HUB-IMPORT {
        term 1 {
            from {
                protocol bgp;
                community NT-SPOKE;
            }
            then accept;
        }
    }
    policy-statement NT-Hub-Import {
        term 1 {
            from {
                route-filter 10.0.0.0/8 prefix-length-range /32-/32;
            }
            then accept;
        }
        term 2 {
            from {
                route-filter 172.65.0.0/16 longer;
            }
            then accept;
        }
    }
    policy-statement NT-Route-Leak {
        term 1 {
            from {
                route-filter 10.65.0.0/16 exact;
                route-filter 172.65.0.0/16 exact;
            }
            then {
                next-hop self;
                accept;
            }
        }
    }
    policy-statement U3-v6-rewrite {
        term 1 {
            from {
                family inet6;
                protocol bgp;
                neighbor 172.16.0.9;
            }
            then {
                community set U3;
                next-hop 2001:172:16:0::9;
                accept;
            }
        }
        term 2 {
            from {
                family inet;
                protocol bgp;
            }
            then {
                community set U3;
            }
        }
    }
    policy-statement nh-self {
        term 1 {
            from {
                family inet;
                protocol bgp;
                as-path U3;
            }
            then {
                next-hop self;
            }
        }
        term 2 {
            from {
                family inet6;
                protocol bgp;
                as-path U3;
            }
            then {
                next-hop 192::2;
                accept;
            }
        }
    }
    policy-statement rr_to_inet3_policy {
        term 1 {
            from {
                instance master;
                protocol isis;
                route-filter 192.168.1.101/32 exact;
                route-filter 192.168.1.102/32 exact;
            }
            to rib inet.3;
            then accept;
        }
        term 2 {
            from instance master;
            to rib inet.3;
            then reject;
        }
    }
    policy-statement self_leak_inet3 {
        term 1 {
            from {
                instance master;
                protocol direct;
                route-filter 192.168.1.2/32 exact;
            }
            to rib inet.3;
            then accept;
        }
    }
    policy-statement standard-deny-import {
        term 1 {
            from {
                protocol bgp;
                route-filter 0.0.0.0/0 through 0.0.0.0/32;
            }
            then reject;
        }
        term 2 {
            from {
                route-filter 0.0.0.0/0 prefix-length-range /0-/7;
                route-filter 0.0.0.0/0 prefix-length-range /25-/31;
            }
            then accept;
        }
        term 3 {
            from community SPECIAL;
            then {
                next-hop discard;
                accept;
            }
        }
    }
    policy-statement strip-communities {
        term 1 {
            from {
                protocol bgp;
                community wildcard-all;
            }
            then {
                community delete wildcard-all;
                accept;
            }
        }
        term 2 {
            then reject;
        }
    }
    policy-statement v6-out-strip {
        term 1 {
            from {
                family inet6;
                protocol bgp;
            }
            then {
                community delete wildcard-all;
                next-hop 2001:172:16:0::a;
                accept;
            }
        }
    }
    community C1 members 999:65101;
    community C2 members 999:65102;
    community NT-HUB members target:999:200;
    community NT-SPOKE members target:999:201;
    community SPECIAL members .:606;
    community U1 members 999:2389;
    community U2 members 999:701;
    community U3 members 999:7311;
    community no-export members no-export;
    community wildcard-all members *:*;
    as-path U3 "7311 .*";
    as-path 65001-PROVIDERS "65001 (23\.89|701|7311|13335)( .*)?";
    as-path 65002-PROVIDERS "65002 (23\.89|701|7311|13335)( .*)?";
    as-path PROVIDERS-DIRECT "(23\.89|701|7311|13335)( .*)?";
}
class-of-service {
    classifiers {
        dscp JNCIE_DSCP {
            forwarding-class BE {
                loss-priority low code-points 000000;
            }
            forwarding-class EF {
                loss-priority high code-points 101110;
            }
            forwarding-class VPN {
                loss-priority low code-points 000010;
            }
            forwarding-class VPN-PRI {
                loss-priority low code-points 000110;
            }
        }
        exp JNCIE_EXP {
            forwarding-class BE {
                loss-priority low code-points 000;
            }
            forwarding-class EF {
                loss-priority high code-points 110;
            }
            forwarding-class VPN {
                loss-priority low code-points 010;
            }
            forwarding-class VPN-PRI {
                loss-priority low code-points 011;
            }
        }
    }
    forwarding-classes {
        class BE queue-num 0;
        class VPN queue-num 1;
        class VPN-PRI queue-num 2;
        class EF queue-num 3;
    }
    interfaces {
        ge-0/0/0 {
            scheduler-map JNCIE_MAP;
            unit 0 {
                classifiers {
                    dscp JNCIE_DSCP;
                    exp JNCIE_EXP;
                }
                rewrite-rules {
                    dscp JNCIE_DSCP_RW;
                    exp JNCIE_EXP_RW;
