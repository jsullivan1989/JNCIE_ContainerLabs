    ldp {
        interface ge-0/0/0.0;
        interface ge-0/0/8.0;
        interface lo0.0;
        sr-mapping-client;
    }
    mpls {
        admin-groups {
            RED 0;
            BLUE 1;
            GREEN 2;
        }
        label-switched-path PE2_To_PE7 {
            to 192.168.1.7;
            bandwidth 10m;
            priority 6 6;
            standby;
            adaptive;
            primary pe6_p4_pe3_pe7;
            secondary secondary;
        }
        label-switched-path PE2_To_P5 {
            to 192.168.1.5;
            priority 6 6;
            standby;
            adaptive;
            auto-bandwidth {
                adjust-interval 7200;
                minimum-bandwidth 1m;
                maximum-bandwidth 10m;
            }
            primary primary {
                admin-group include-any GREEN;
            }
            secondary secondary;
        }
        label-switched-path PE2_To_PE3 {
            to 192.168.1.3;
            bandwidth 10m;
            priority 6 6;
            oam {
                bfd-liveness-detection {
                    minimum-interval 300;
                    multiplier 3;
                }
            }
            standby;
            adaptive;
            primary primary;
            secondary secondary;
        }
        label-switched-path PE2_To_PE6 {
            to 192.168.1.6;
            bandwidth 10m;
            priority 6 6;
            standby;
            adaptive;
            primary primary;
            secondary secondary;
        }
        label-switched-path I-PMSI-Template {
            template;
            bandwidth 60m;
            priority 5 5;
            p2mp;
        }
        label-switched-path S-PMSI-Template {
            template;
            bandwidth 50m;
            priority 5 5;
            p2mp;
        }
        path primary;
        path secondary;
        path pe6_p4_pe3_pe7 {
            192.168.1.6 strict;
            192.168.1.4 strict;
            192.168.1.3 strict;
            192.168.1.7 strict;
        }
        ipv6-tunneling;
        interface lo0.0;
        interface ge-0/0/0.0 {
            admin-group [ BLUE GREEN ];
        }
        interface ge-0/0/1.0 {
            admin-group [ BLUE GREEN ];
        }
        interface ge-0/0/8.0;
    }
    rsvp {
        interface ge-0/0/0.0 {
            link-protection;
        }
        interface ge-0/0/1.0 {
            link-protection;
        }
        interface lo0.0;
    }
    l2-learning {
        traceoptions {
            file VPLS;
            flag all;
        }
    }
}
