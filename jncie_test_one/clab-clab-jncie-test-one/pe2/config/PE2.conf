                        flow-server 8.8.8.8 {
                            port 2055;
                            source-address 192.168.1.2;
                            version-ipfix {
                                template {
                                    jncie_template_v6;
                                }
                            }
                        }
                        inline-jflow {
                            source-address 192.168.1.2;
                        }
                    }
                }
            }
            JNCIE_v9 {
                family inet {
                    input {
                        rate 100;
                    }
                    output {
                        flow-inactive-timeout 30;
                        flow-active-timeout 60;
                        flow-server 8.8.8.9 {
                            port 2055;
                            source-address 192.168.1.2;
                            version9 {
                                template {
                                    jncie_template_v4;
                                }
