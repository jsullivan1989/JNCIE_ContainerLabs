        policy-options {
            prefix-list DOCKER_MGMT {
                10.0.0.0/24;
            }
            prefix-list LS-BGP-NEIGHBORS {
                apply-path "logical-systems <*> protocols bgp group <*> neighbor <*>";
            }
            prefix-list LS-NTP-SERVERS;
            prefix-list LS-RI-BGP-NEIGHBORS {
                apply-path "logical-systems <*> routing-instances <*> protocols bgp group <*> neighbor <*>";
            }
            policy-statement DO-Rewrite {
                term 1 {
                    from {
                        family inet-vpn;
                        community DIGITAL-OCEAN-R;
                    }
                    then {
                        community delete DIGITAL-OCEAN-R;
                        community set DIGITAL-OCEAN-L;
                        accept;
                    }
                }
            }
            policy-statement HAS-ISIS-CONDITIONAL {
                term 1 {
                    from {
                        protocol isis;
                        route-filter 192.168.1.0/24 prefix-length-range /32-/32;
                    }
                    then accept;
                }
                term 2 {
                    then reject;
                }
            }
            policy-statement L1-To-L2-Loopbacks {
                term not-my-own {
                    from {
                        route-filter 192.168.1.6/32 exact;
                    }
                    to level 1;
                    then reject;
                }
                term 1 {
                    from {
                        family inet;
                        route-filter 192.168.1.0/29 longer;
                        route-filter 192.168.1.8/31 longer;
                        route-filter 192.168.1.101/32 exact;
                        route-filter 192.168.1.102/32 exact;
                    }
                    then accept;
                }
                term 2 {
                    from {
                        family inet6;
                        route-filter 192::0/125 longer;
                        route-filter 192::8/127 longer;
                    }
                    then accept;
                }
                term 3 {
                    then reject;
                }
            }
            policy-statement NO-TRANSIT {
                term 1 {
                    from {
                        protocol bgp;
                        as-path [ 65001-PROVIDERS 65002-PROVIDERS PROVIDERS-DIRECT ];
                    }
                    then reject;
                }
            }
            policy-statement nh-self {
                term 1 {
                    from {
                        family inet;
                        protocol bgp;
                        as-path [ U1 U2 ];
                    }
                    then {
                        next-hop self;
                    }
                }
                term 2 {
                    from {
                        family inet6;
                        protocol bgp;
                        as-path [ U2 U1 65002-U1 65002-U2 ];
                    }
                    then {
                        next-hop self;
                        accept;
                    }
                }
                term 3 {
                    from family inet-vpn;
                    then {
                        next-hop self;
                        accept;
                    }
                }
            }
            policy-statement nh-self-cbgp {
                term 1 {
                    from {
                        family inet;
                        protocol bgp;
                        as-path [ C2 C1 U3 ];
                    }
                    then {
                        next-hop self;
                    }
                }
                term 2 {
                    from {
                        family inet6;
                        protocol bgp;
                        as-path [ C2 C1 U3 ];
                    }
                    then {
                        next-hop 192::6;
                        accept;
                    }
                }
                term 3 {
                    from family inet-vpn;
                    then {
                        next-hop self;
                        accept;
                    }
                }
            }
            policy-statement rr_to_inet3_policy {
                term 1 {
                    from {
                        instance master;
                        protocol isis;
                        route-filter 192.168.1.101/32 exact;
                        route-filter 192.168.1.102/32 exact;
                    }
                    to rib inet.3;
                    then accept;
                }
                term 2 {
                    from instance master;
                    to rib inet.3;
                    then reject;
                }
            }
            policy-statement self_to_inet3 {
                term 1 {
                    from {
                        instance master;
                        route-filter 192.168.1.6/32 exact;
                    }
                    to rib inet.3;
                    then accept;
                }
                term 2 {
                    from instance master;
                    to rib inet.3;
                    then reject;
                }
            }
            policy-statement standard_deny_import {
                term 1 {
                    from {
                        protocol bgp;
                        route-filter 0.0.0.0/0 through 0.0.0.0/32;
                    }
                    then reject;
                }
                term 2 {
                    from {
                        route-filter 0.0.0.0/0 prefix-length-range /0-/7;
                        route-filter 0.0.0.0/0 prefix-length-range /25-/31;
                    }
                    then accept;
                }
                term 3 {
                    from community SPECIAL;
                    then {
                        next-hop discard;
                        accept;
                    }
                }
            }
            community C1 members 999:65101;
            community C2 members 999:65102;
            community DIGITAL-OCEAN-L members target:999:100;
            community DIGITAL-OCEAN-R members target:999:101;
            community SPECIAL members .:606;
            community U1 members 999:2389;
            community U2 members 999:701;
            community U3 members 999:7311;
            community no-export members no-export;
            community wildcard-all members *:*;
            as-path U1 "23\.89 .*";
            as-path U2 "701 .*";
            as-path C2 "65102 .*";
            as-path C1 "65101 .*";
            as-path U3 "7311 .*";
            as-path PROVIDERS-DIRECT "(23\.89|701|7311|13335)( .*)?";
            as-path 65001-PROVIDERS "65001 (23\.89|701|7311|13335)( .*)?";
            as-path 65002-PROVIDERS "65002 (23\.89|701|7311|13335)( .*)?";
            as-path 65002-U2 "65002 23\.89 .*";
            as-path 65002-U1 "65002 701 .*";
        }
        routing-instances {
            EVPN {
