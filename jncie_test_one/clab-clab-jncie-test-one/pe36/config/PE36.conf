protocols {
    bgp {
        group IBGP {
            type internal;
            multihop;
            local-address 192.168.1.3;
            log-updown;
            family inet {
                unicast;
            }
            family inet-vpn {
                unicast;
            }
            family inet6 {
                unicast;
            }
            family l2vpn {
                signaling;
            }
            family evpn {
                signaling;
            }
