            }
        }
        routing-options {
            source-packet-routing {
                mapping-server-entry PE8 {
                    prefix-segment 192.168.1.8/32 index 108;
                }
            }
            rib inet6.0 {
                static {
                    route 192::/16 discard;
                }
            }
            autonomous-system 65001;
            confederation 999 members [ 65001 65002 ];
            static {
                route 192.168.1.0/24 discard;
            }
            generate {
                route 0.0.0.0/0 policy HAS-ISIS-CONDITIONAL;
            }
            rib-groups {
                rr_inet0_to_inet3 {
                    import-rib [ inet.0 inet.3 ];
                    import-policy rr_to_inet3_policy;
                }
                self_to_inet3 {
                    import-rib [ inet.0 inet.3 ];
                    import-policy self_to_inet3;
                }
            }
        }
        system {
            syslog {
                file firewall_log {
                    firewall any;
                }
            }
        }
        firewall {
            family inet {
                filter protect_re {
                    term 1 {
                        from {
                            source-prefix-list {
                                DOCKER_MGMT;
                            }
                            protocol tcp;
                            destination-port [ ssh 830 ];
                        }
                        then {
                            count ssh_counter;
                            accept;
                        }
                    }
                    term 2 {
                        from {
                            source-prefix-list {
                                LS-NTP-SERVERS;
                            }
                            protocol udp;
                            port ntp;
                        }
                        then {
                            count ntp_counter;
                            accept;
                        }
                    }
                    term 3 {
                        from {
                            source-prefix-list {
                                LS-BGP-NEIGHBORS;
                                LS-RI-BGP-NEIGHBORS;
                            }
                            protocol tcp;
                            port bgp;
                        }
                        then {
                            count bgp_counter;
                            accept;
                        }
                    }
                    term 4 {
                        from {
                            source-address {
                                8.8.8.8/32;
                            }
                            protocol udp;
                            destination-port snmp;
                        }
                        then {
                            count snmp_counter;
                            accept;
                        }
                    }
                    term 5 {
                        from {
                            protocol ospf;
                        }
                        then {
                            count ospf_counter;
                            accept;
                        }
                    }
                    term 6 {
                        from {
                            protocol rsvp;
                        }
                        then {
                            count rsvp_counter;
                            accept;
                        }
                    }
                    term 7 {
                        from {
                            protocol udp;
                            destination-port [ 8503 3503 ];
                        }
                        then {
                            count mpls_oam_counter;
                            accept;
                        }
                    }
                    term 8 {
                        from {
                            protocol udp;
                            destination-port [ 3784 3785 4784 ];
                        }
                        then {
                            count bfd_counter;
                            accept;
                        }
                    }
                    term 9 {
                        from {
                            protocol icmp;
                            icmp-type [ time-exceeded echo-reply echo-request ];
                        }
                        then {
                            count icmp_counter;
                            accept;
                        }
                    }
                    term 10 {
                        from {
                            protocol udp;
                            port 33434-33534;
                        }
                        then {
                            count traceroute_counter;
                            accept;
                        }
                    }
                    term 11 {
                        from {
                            protocol [ udp tcp ];
                            port 646;
                        }
                        then {
                            count ldp_counter;
                            accept;
                        }
                    }
                    term 12 {
                        from {
                            source-address {
                                8.8.8.8/32;
                            }
                            protocol tcp;
                            destination-port 54321;
                        }
                        then {
                            count grpc_count;
                            accept;
                        }
                    }
                    term 13 {
                        then {
                            count discard_counter;
                            discard;
                        }
                    }
                }
            }
            family inet6 {
                filter protect_re_v6 {
                    term 1 {
                        from {
                            next-header ospf;
                        }
                        then {
                            count ospf_counter;
                            accept;
                        }
                    }
                    term 2 {
                        from {
                            next-header tcp;
                            port bgp;
                        }
                        then {
                            count bgp_counter_v6;
                            accept;
                        }
                    }
                    term 3 {
                        from {
                            next-header icmp6;
                            icmp-type [ neighbor-advertisement neighbor-solicit router-advertisement router-solicit inverse-neighbor-discovery-advertisement inverse-neighbor-discovery-solicitation echo-reply echo-request time-exceeded ];
                        }
                        then {
                            count icmp_v6_counter;
                            accept;
                        }
                    }
                    term 4 {
                        from {
                            next-header udp;
                            port 33434-33534;
                        }
                        then {
                            count traceroute_counter;
                            accept;
                        }
                    }
                    term 5 {
                        then discard;
                    }
                }
            }
        }
    }
}
