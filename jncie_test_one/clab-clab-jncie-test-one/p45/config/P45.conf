routing-instances {
    L2VPN {
        instance-type l2vpn;
        protocols {
            l2vpn {
                site SITE-4 {
                    interface iw0.1 {
                        remote-site-id 9;
                        encapsulation-type ethernet-vlan;
                    }
                    site-identifier 4;
                }
                encapsulation-type ethernet-vlan;
                ignore-encapsulation-mismatch;
            }
        }
        interface iw0.1;
        route-distinguisher 192.168.1.4:581;
        vrf-target target:999:581;
    }
    mgmt_junos {
        routing-options {
            rib mgmt_junos.inet6.0 {
                static {
                    route ::/0 next-hop 2001:db8::1;
                }
            }
