interfaces {
    ge-0/0/0 {
        description "To DC1-BL";
        flexible-vlan-tagging;
        native-vlan-id 1;
        unit 0 {
            description "To DC1_BL1 INET Peering";
            vlan-id 1;
            family inet {
                address 198.0.1.0/31;
            }
        }
        unit 10 {
            description "To DC1_BL1 T1 Peering";
            vlan-id 10;
            family inet {
                address 198.0.10.0/31;
            }
        }
        unit 20 {
            description "To DC1_BL1 T2 Peering";
            vlan-id 20;
            family inet {
                address 198.0.20.0/31;
            }
        }
    }
    ge-0/0/1 {
        description "To DC2-BL";
        flexible-vlan-tagging;
        native-vlan-id 1;
        unit 0 {
            description "To DC2_BL1 INET Peering";
            vlan-id 1;
            family inet {
                address 198.1.1.0/31;
            }
        }
        unit 10 {
            description "To DC2_BL1 T1 Peering";
            vlan-id 10;
            family inet {
                address 198.1.10.0/31;
            }
        }
        unit 20 {
            description "To DC2_BL1 T2 Peering";
            vlan-id 20;
            family inet {
                address 198.1.20.0/31;
            }
        }
    }
    fxp0 {
        unit 0 {
            family inet {
                address 10.0.0.15/24;
            }
            family inet6 {
                address 2001:db8::2/64;
            }
        }
    }
}
policy-options {
    policy-statement default_only {
        term 1 {
            from {
                route-filter 0.0.0.0/0 exact;
            }
            then accept;
        }
        term 2 {
            then reject;
        }
    }
    policy-statement default_route {
        term 1 {
            from {
                route-filter 0.0.0.0/0 exact;
            }
            then accept;
        }
    }
    policy-statement default_route_backup {
        term 1 {
            from {
                route-filter 0.0.0.0/0 exact;
                route-filter 8.8.8.0/24 exact;
                route-filter 100.100.100.100/32 exact;
            }
            then {
                as-path-prepend "101 101 101";
                accept;
            }
        }
    }
}
routing-instances {
    DC1 {
        instance-type virtual-router;
        routing-options {
            autonomous-system 101;
            static {
                route 0.0.0.0/0 discard;
            }
        }
        protocols {
            bgp {
                group To_DC1_INET {
                    type external;
                    family inet {
                        unicast;
                    }
                    as-override;
                    neighbor 198.0.1.1 {
                        peer-as 65103;
                    }
                }
                group To_DC1_T1 {
                    type external;
                    family inet {
                        unicast;
                    }
                    export default_route_backup;
                    as-override;
                    neighbor 198.0.10.1 {
                        peer-as 65103;
                    }
                }
                group To_DC1_T2 {
                    type external;
                    family inet {
                        unicast;
                    }
                    export default_route_backup;
                    as-override;
                    neighbor 198.0.20.1 {
                        peer-as 65103;
                    }
                }
            }
        }
        interface ge-0/0/0.0;
        interface ge-0/0/0.10;
        interface ge-0/0/0.20;
    }
    DC2 {
        instance-type virtual-router;
        routing-options {
            autonomous-system 102;
            static {
                route 0.0.0.0/0 discard;
            }
        }
        protocols {
            bgp {
                group To_DC2_INET {
                    type external;
                    family inet {
                        unicast;
                    }
                    as-override;
                    neighbor 198.1.1.1 {
                        peer-as 65203;
                    }
                }
                group To_DC2_T1 {
                    type external;
                    family inet {
                        unicast;
                    }
                    export default_route;
                    as-override;
                    neighbor 198.1.10.1 {
                        peer-as 65203;
                    }
                }
                group To_DC2_T2 {
                    type external;
                    family inet {
                        unicast;
                    }
                    export default_route;
                    as-override;
                    neighbor 198.1.20.1 {
                        peer-as 65203;
                    }
                }
            }
        }
        interface ge-0/0/1.0;
        interface ge-0/0/1.10;
        interface ge-0/0/1.20;
    }
    mgmt_junos {
        routing-options {
            rib mgmt_junos.inet6.0 {
                static {
                    route ::/0 next-hop 2001:db8::1;
                }
            }
            static {
                route 0.0.0.0/0 next-hop 10.0.0.2;
            }
        }
    }
}
