security {
    address-book {
        global {
            address Tenant1_V100 172.16.100.0/24;
            address Tenant1_V101 172.16.101.0/24;
            address Tenant2_V102 172.16.102.0/24;
            address Tenant2_V103 172.16.103.0/24;
            address Tenant2_V104 172.16.104.0/24;
            address Tenant2_V105 172.16.105.0/24;
            address GOOGLE 8.8.8.0/24;
            address vMX-LOOPBACK 100.100.100.100/32;
            address-set DC1_Tenant1 {
                address Tenant1_V100;
                address Tenant1_V101;
            }
            address-set DC1_Tenant2 {
                address Tenant2_V102;
                address Tenant2_V103;
            }
            address-set INET_HOSTS {
                address GOOGLE;
                address vMX-LOOPBACK;
            }
            address-set DC2_Tenant1 {
                address Tenant1_V100;
            }
            address-set DC2_Tenant2 {
                address Tenant2_V102;
                address Tenant2_V104;
            }
        }
    }
    policies {
        from-zone DC1_T1 to-zone DC1_T2 {
            policy InterT_DC1_T1_to_T2 {
                match {
                    source-address DC1_Tenant1;
                    destination-address DC1_Tenant2;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone DC1_T2 to-zone DC1_T1 {
            policy InterT_DC1_T2_to_T1 {
                match {
                    source-address DC1_Tenant2;
                    destination-address DC1_Tenant1;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone DC2_T1 to-zone DC2_T2 {
            policy InterT_DC2_T1_to_T2 {
                match {
                    source-address DC2_Tenant1;
                    destination-address DC2_Tenant2;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone DC2_T2 to-zone DC2_T1 {
            policy InterT_DC2_T2_to_T1 {
                match {
                    source-address DC2_Tenant2;
                    destination-address DC2_Tenant1;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone DC2_T1 to-zone DC2_INET {
            policy DC2_INET_to_T1 {
                match {
                    source-address DC2_Tenant1;
                    destination-address INET_HOSTS;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone DC2_T2 to-zone DC2_INET {
            policy DC2_INET_to_T2 {
                match {
                    source-address DC2_Tenant2;
                    destination-address INET_HOSTS;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone DC2_INET to-zone DC2_T1 {
            policy DC2_INET_to_T1 {
                match {
                    source-address INET_HOSTS;
                    destination-address DC2_Tenant1;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone DC2_INET to-zone DC2_T2 {
            policy DC2_INET_to_T2 {
                match {
                    source-address INET_HOSTS;
                    destination-address DC2_Tenant2;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone DC1_INET to-zone DC1_T1 {
            policy DC1_INET_to_T1 {
                match {
                    source-address INET_HOSTS;
                    destination-address DC1_Tenant1;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone DC1_INET to-zone DC1_T2 {
            policy DC1_INET_to_T2 {
                match {
                    source-address INET_HOSTS;
                    destination-address DC1_Tenant2;
                    application any;
                }
                then {
                    permit;
                }
