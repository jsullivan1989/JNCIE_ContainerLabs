policy-options {
    policy-statement AllPodNetworks {
        term 10 {
            from {
                family inet;
                protocol direct;
            }
            then {
                community add DIRECT_V4;
                accept;
            }
        }
        term 20 {
            then reject;
        }
    }
    policy-statement FROM-SPINE-FABRIC-TIER {
        term 10 {
            from community UNDERLAY-NO-READV;
            then reject;
        }
        term 20 {
            then accept;
        }
    }
    policy-statement LEAF-TO-SPINE-EVPN-TIER {
        term 10 {
            from community EVPN-NO-READV;
            then reject;
        }
        term 20 {
            then {
                community add EVPN_HOSTS;
                accept;
            }
        }
    }
    policy-statement LOAD-BALANCE {
        then {
            load-balance per-packet;
        }
    }
    community DIRECT_V4 members [ 1:1001 2000:1001 ];
    community EVPN-NO-READV members 0:14;
    community EVPN_HOSTS members [ 1:1002 3000:1001 ];
    community UNDERLAY-NO-READV members 0:15;
}
routing-instances {
    TENANT1-L3VRF-L1 {
        instance-type vrf;
        protocols {
            evpn {
                irb-symmetric-routing {
                    vni 11111;
                }
                ip-prefix-routes {
                    advertise direct-nexthop;
                    encapsulation vxlan;
                    vni 11111;
                }
            }
        }
        interface irb.100;
        interface irb.101;
        route-distinguisher 192.168.1.1:11111;
        vrf-target target:11111:11111;
        vrf-table-label;
    }
    TENANT2-L3VRF-L1 {
        instance-type vrf;
        protocols {
            evpn {
                irb-symmetric-routing {
                    vni 22222;
                }
                ip-prefix-routes {
                    advertise direct-nexthop;
                    encapsulation vxlan;
                    vni 22222;
                }
            }
        }
        interface irb.102;
        interface irb.103;
        route-distinguisher 192.168.1.1:22222;
        vrf-target target:22222:22222;
        vrf-table-label;
    }
    mac-vrf-leaf-1 {
        instance-type mac-vrf;
        protocols {
            evpn {
                encapsulation vxlan;
                default-gateway no-gateway-community;
                extended-vni-list all;
                vni-options {
                    vni 10100 {
                        vrf-target target:10100:10100;
                    }
                    vni 10101 {
                        vrf-target target:10101:10101;
                    }
                    vni 10102 {
                        vrf-target target:10102:10102;
                    }
                    vni 10103 {
                        vrf-target target:10103:10103;
                    }
                }
            }
        }
        vtep-source-interface lo0.0;
        service-type vlan-aware;
        interface ge-0/0/2.0;
        route-distinguisher 192.168.1.1:1;
        vrf-target target:1:1;
        vlans {
            v100 {
                vlan-id 100;
                l3-interface irb.100;
                vxlan {
                    vni 10100;
                }
            }
            v101 {
                vlan-id 101;
                l3-interface irb.101;
                vxlan {
                    vni 10101;
                }
            }
            v102 {
                vlan-id 102;
                l3-interface irb.102;
                vxlan {
                    vni 10102;
                }
            }
            v103 {
                vlan-id 103;
                l3-interface irb.103;
                vxlan {
                    vni 10103;
                }
            }
        }
    }
    mgmt_junos {
        routing-options {
            rib mgmt_junos.inet6.0 {
                static {
                    route ::/0 next-hop 2001:db8::1;
                }
            }
            static {
                route 0.0.0.0/0 next-hop 10.0.0.2;
            }
        }
    }
}
routing-options {
    router-id 192.168.1.1;
    autonomous-system 65101;
    forwarding-table {
        export LOAD-BALANCE;
    }
}
protocols {
    bgp {
        group l3-clos-underlay {
            type external;
            log-updown;
            family inet {
                unicast;
            }
            export ( AllPodNetworks && FROM-SPINE-FABRIC-TIER );
            multipath {
                multiple-as;
            }
            neighbor 192.0.2.1 {
                peer-as 65104;
            }
            neighbor 192.0.2.3 {
                peer-as 65105;
            }
        }
        group l3-clos-overlay {
            type external;
            multihop;
            local-address 192.168.1.1;
            family evpn {
                signaling;
            }
            export LEAF-TO-SPINE-EVPN-TIER;
            multipath {
                multiple-as;
            }
            neighbor 192.168.1.4 {
                peer-as 65104;
            }
            neighbor 192.168.1.5 {
                peer-as 65105;
            }
        }
    }
    rstp {
        interface ge-0/0/2 {
            edge;
        }
        bpdu-block-on-edge;
    }
}
