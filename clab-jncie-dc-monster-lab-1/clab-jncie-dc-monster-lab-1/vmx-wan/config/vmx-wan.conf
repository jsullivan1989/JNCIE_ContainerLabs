chassis {
    fpc 0 {
        pic 0 {
            number-of-ports 12;
        }
    }
}
interfaces {
    ge-0/0/0 {
        description "To DC1-BL1";
        unit 0 {
            family inet {
                address 10.254.0.0/31;
            }
        }
    }
    ge-0/0/1 {
        description "To DC2-BL1";
        unit 0 {
            family inet {
                address 10.254.0.2/31;
            }
        }
    }
    ge-0/0/2 {
        description "To DC3-S1";
        unit 0 {
            family inet {
                address 10.254.0.4/31;
            }
        }
    }
    ge-0/0/3 {
        description "To DC3-S2";
        unit 0 {
            family inet {
                address 10.254.0.6/31;
            }
        }
    }
    ge-0/0/4 {
        description "To Google Sim host";
        unit 0 {
            family inet {
                address 8.8.8.1/24;
            }
        }
    }
    ge-0/0/5 {
        description "To DC2-BL2";
        unit 0 {
            family inet {
                address 10.254.0.8/31;
            }
        }
    }
    fxp0 {
        unit 0 {
            family inet {
                address 10.0.0.15/24;
            }
            family inet6 {
                address 2001:db8::2/64;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 100.100.100.100/32;
            }
        }
    }
}
policy-options {
    policy-statement DC3_more_pref {
        term 1 {
            then {
                local-preference 150;
                accept;
            }
        }
    }
    policy-statement default_only {
        term 1 {
            from {
                route-filter 0.0.0.0/0 exact;
            }
            then accept;
        }
        term 2 {
            then reject;
        }
    }
    policy-statement default_only_backup {
        term 1 {
            from {
                route-filter 0.0.0.0/0 exact;
            }
            then {
                as-path-prepend "701 701";
                accept;
            }
        }
        term 2 {
            then reject;
        }
    }
    policy-statement re-adv-dc-loopbacks-and-inet {
        term 1 {
            from {
                protocol direct;
                route-filter 8.8.8.0/24 exact;
            }
            then accept;
        }
        term 2 {
            from {
                route-filter 192.168.1.0/24 prefix-length-range /32-/32;
            }
            then accept;
        }
        term 3 {
            from {
                route-filter 192.168.2.0/24 prefix-length-range /32-/32;
            }
            then accept;
        }
        term 4 {
            from {
                route-filter 192.168.3.0/24 prefix-length-range /32-/32;
            }
            then accept;
        }
        term 5 {
            from {
                route-filter 100.100.100.100/32 exact;
            }
            then accept;
        }
        term 6 {
            then reject;
        }
    }
}
routing-instances {
    mgmt_junos {
        routing-options {
            rib mgmt_junos.inet6.0 {
                static {
                    route ::/0 next-hop 2001:db8::1;
                }
            }
            static {
                route 0.0.0.0/0 next-hop 10.0.0.2;
            }
        }
    }
}
routing-options {
    autonomous-system 701;
    static {
        route 0.0.0.0/0 discard;
    }
}
protocols {
    bgp {
        group to_DCs {
            type external;
            log-updown;
            family inet {
                unicast;
            }
            export re-adv-dc-loopbacks-and-inet;
            neighbor 10.254.0.1 {
                peer-as 65103;
            }
            neighbor 10.254.0.3 {
                peer-as 65203;
            }
            neighbor 10.254.0.5 {
                import DC3_more_pref;
                export default_only;
                peer-as 65304;
            }
            neighbor 10.254.0.7 {
                export default_only_backup;
                peer-as 65305;
            }
            neighbor 10.254.0.9 {
                peer-as 65206;
            }
        }
    }
}
