            from community [ TENANT2-COMM Shared-Tenant ];
            then accept;
        }
        term 2 {
            then reject;
        }
    }
    community DIRECT_V4 members [ 1:3001 2000:3001 ];
    community EVPN-NO-READV members 2:14;
    community EVPN_HOSTS members [ 1:3002 3000:3001 ];
    community INET-EVPN-LEAK members 2:99;
    community Shared-Tenant members target:444:444;
    community T5-iRT members target:2999:2999;
    community T5-iRT-1 members target:1999:1999;
    community TENANT1-COMM members target:33331:33331;
    community TENANT2-COMM members target:33333:33333;
    community UNDERLAY-NO-READV members 2:15;
    community iRT members target:99:99;
    as-path No-DC1-DC2 ".* (65100-65109|65200-65209) .*";
}
routing-instances {
    TENANT1-L3VRF-L1 {
        instance-type vrf;
        routing-options {
            static {
                route 0.0.0.0/0 next-table inet.0;
            }
            multipath;
            auto-export {
                family inet {
                    unicast {
                        rib-group Tenant1_To_INET;
                    }
                }
            }
        }
        protocols {
            evpn {
                irb-symmetric-routing {
                    vni 33331;
                }
                interconnect {
                    vrf-target target:1999:1999;
                    route-distinguisher 192.168.3.1:1999;
                    encapsulation vxlan;
                }
                ip-prefix-routes {
                    advertise direct-nexthop;
                    encapsulation vxlan;
                    vni 33331;
                }
            }
        }
        interface irb.100;
        interface irb.101;
        route-distinguisher 192.168.3.1:33331;
        vrf-import import-tenant1-and-shared;
        vrf-export export-tenant1-and-shared;
        vrf-table-label;
    }
    TENANT2-L3VRF-L1 {
        instance-type vrf;
        routing-options {
            static {
                route 0.0.0.0/0 next-table inet.0;
            }
            multipath;
            auto-export {
                family inet {
                    unicast {
                        rib-group Tenant2_To_INET;
                    }
                }
            }
        }
        protocols {
            evpn {
                irb-symmetric-routing {
                    vni 33333;
                }
                interconnect {
                    vrf-target target:2999:2999;
                    route-distinguisher 192.168.3.1:2999;
                    encapsulation vxlan;
                }
                ip-prefix-routes {
                    advertise direct-nexthop;
                    encapsulation vxlan;
                    vni 33333;
                }
            }
        }
        interface irb.105;
        route-distinguisher 192.168.3.1:33333;
        vrf-import import-tenant2-and-shared;
        vrf-export export-tenant2-and-shared;
        vrf-table-label;
    }
    mac-vrf-leaf-1 {
        instance-type mac-vrf;
        protocols {
            evpn {
                encapsulation vxlan;
                default-gateway no-gateway-community;
                extended-vni-list all;
                interconnect {
                    vrf-target target:99:99;
                    route-distinguisher 192.168.3.1:99;
                    interconnected-vni-list 99100;
                    encapsulation vxlan;
                }
                vni-options {
                    vni 10100 {
                        vrf-target target:10100:10100;
                    }
                    vni 10101 {
                        vrf-target target:10101:10101;
                    }
                    vni 10105 {
                        vrf-target target:10105:10105;
                    }
                }
            }
        }
        vtep-source-interface lo0.0;
        service-type vlan-aware;
        interface ge-0/0/2.0;
        route-distinguisher 192.168.3.1:1;
        vrf-target target:1:1;
        vlans {
            v100 {
                vlan-id 100;
                l3-interface irb.100;
                vxlan {
                    vni 10100;
                    translation-vni 99100;
                }
            }
            v101 {
                vlan-id 101;
                l3-interface irb.101;
                vxlan {
                    vni 10101;
                }
            }
            v105 {
                vlan-id 105;
                l3-interface irb.105;
                vxlan {
                    vni 10105;
                }
            }
        }
    }
    mgmt_junos {
        routing-options {
            rib mgmt_junos.inet6.0 {
                static {
                    route ::/0 next-hop 2001:db8::1;
                }
            }
            static {
                route 0.0.0.0/0 next-hop 10.0.0.2;
            }
        }
    }
}
routing-options {
    router-id 192.168.3.1;
    autonomous-system 65301;
    rib-groups {
        Tenant1_To_INET {
            import-rib [ TENANT1-L3VRF-L1.inet.0 inet.0 ];
            import-policy Tenant_to_inet;
        }
        Tenant2_To_INET {
