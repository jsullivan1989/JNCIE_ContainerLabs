                    encapsulation ethernet;
                    peer-unit 7;
                    family inet {
                        address 192.2.2.6/31;
                    }
                }
            }
            ge-0/0/3 {
                unit 0 {
                    family ethernet-switching {
                        interface-mode trunk;
                        vlan {
                            members [ v100 v101 v105 ];
                        }
                    }
                }
            }
            irb {
                unit 110 {
                    family inet {
                        address 172.16.100.1/24;
                    }
                    mac 00:00:00:00:01:00;
                }
                unit 111 {
                    family inet {
                        address 172.16.101.1/24;
                    }
                    mac 00:00:00:00:01:02;
                }
                unit 115 {
                    family inet {
                        address 172.16.105.1/24;
                    }
                    mac 00:00:00:00:01:04;
                }
            }
            lo0 {
                unit 1 {
                    family inet {
                        address 192.168.3.2/32;
                    }
                }
            }
        }
        protocols {
            bgp {
                group l3-clos-underlay {
                    type internal;
                    log-updown;
                    family inet {
                        unicast;
                    }
                    export ( AllPodNetworks && FROM-SPINE-FABRIC-TIER );
                    local-as 65003;
                    multipath;
                    neighbor 192.2.2.5;
                    neighbor 192.2.2.7;
                }
                group l3-clos-overlay {
                    type internal;
                    multihop;
                    local-address 192.168.3.2;
                    family evpn {
                        signaling;
                    }
                    export LEAF-TO-SPINE-EVPN-TIER;
                    local-as 65003;
                    multipath;
                    neighbor 192.168.3.4;
                    neighbor 192.168.3.5;
                }
            }
            rstp {
                interface ge-0/0/3 {
                    edge;
                }
                bpdu-block-on-edge;
            }
        }
        policy-options {
            policy-statement AllPodNetworks {
                term 10 {
                    from {
                        family inet;
                        protocol direct;
                    }
                    then {
                        community add DIRECT_V4;
                        accept;
                    }
                }
                term 20 {
                    then reject;
                }
                term 15 {
                    from {
                        route-filter 172.16.0.0/12 prefix-length-range /24-/32;
                    }
                    then {
                        community add INET-EVPN-LEAK;
                        accept;
                    }
                }
            }
            policy-statement FROM-SPINE-FABRIC-TIER {
                term 10 {
                    from community UNDERLAY-NO-READV;
                    then reject;
                }
                term 20 {
                    then accept;
                }
            }
            policy-statement LEAF-TO-SPINE-EVPN-TIER {
                term 10 {
                    from community EVPN-NO-READV;
                    then reject;
                }
                term 20 {
                    then {
                        community add EVPN_HOSTS;
                        accept;
                    }
                }
            }
            policy-statement Tenant_to_inet {
                term 1 {
                    from as-path No-DC1-DC2;
                    then reject;
                }
                term 2 {
                    from community [ T5-iRT iRT T5-iRT-1 ];
                    then reject;
                }
                term 3 {
                    from {
                        route-filter 172.16.0.0/12 prefix-length-range /24-/32;
                    }
                    then accept;
                }
                term 4 {
                    then reject;
                }
            }
            policy-statement export-tenant1-and-shared {
                term 1 {
                    then {
                        community add TENANT1-COMM;
                        community add Shared-Tenant;
                        accept;
                    }
                }
            }
            policy-statement export-tenant2-and-shared {
                term 1 {
                    then {
                        community add TENANT2-COMM;
                        community add Shared-Tenant;
                        accept;
                    }
                }
            }
            policy-statement import-tenant1-and-shared {
                term 1 {
                    from community [ TENANT1-COMM Shared-Tenant ];
                    then accept;
                }
                term 2 {
                    then reject;
                }
            }
            policy-statement import-tenant2-and-shared {
                term 1 {
                    from community [ TENANT2-COMM Shared-Tenant ];
                    then accept;
                }
                term 2 {
                    then reject;
                }
            }
            community DIRECT_V4 members [ 2:3001 2000:3001 ];
            community EVPN-NO-READV members 2:14;
            community EVPN_HOSTS members [ 2:3002 3000:3001 ];
            community INET-EVPN-LEAK members 2:99;
            community Shared-Tenant members target:444:444;
            community T5-iRT members target:2999:2999;
            community T5-iRT-1 members target:1999:1999;
            community TENANT1-COMM members target:33331:33331;
            community TENANT2-COMM members target:33333:33333;
            community UNDERLAY-NO-READV members 2:15;
            community iRT members target:99:99;
            as-path No-DC1-DC2 ".* (65100-65109|65200-65209) .*";
        }
        routing-instances {
            TENANT1-L3VRF-L1 {
                routing-options {
                    static {
                        route 0.0.0.0/0 next-table inet.0;
                    }
                }
            }
            TENANT1-L3VRF-L2 {
                instance-type vrf;
                routing-options {
                    static {
                        route 0.0.0.0/0 next-table inet.0;
                    }
                    multipath;
                    auto-export {
                        family inet {
                            unicast {
                                rib-group Tenant1_To_INET;
                            }
                        }
                    }
                }
                protocols {
                    evpn {
                        irb-symmetric-routing {
                            vni 33331;
                        }
                        ip-prefix-routes {
                            advertise direct-nexthop;
                            encapsulation vxlan;
                            vni 33331;
                        }
                    }
                }
                interface irb.110;
                interface irb.111;
                route-distinguisher 192.168.3.2:33331;
                vrf-import import-tenant1-and-shared;
                vrf-export export-tenant1-and-shared;
                vrf-table-label;
            }
            TENANT2-L3VRF-L2 {
                instance-type vrf;
                routing-options {
                    multipath;
                    auto-export {
                        family inet {
                            unicast {
                                rib-group Tenant2_To_INET;
                            }
                        }
                    }
                }
                protocols {
                    evpn {
                        irb-symmetric-routing {
                            vni 33333;
                        }
                        ip-prefix-routes {
                            advertise direct-nexthop;
                            encapsulation vxlan;
                            vni 33333;
                        }
                    }
                }
                interface irb.115;
                route-distinguisher 192.168.3.2:33333;
                vrf-import import-tenant2-and-shared;
                vrf-export export-tenant2-and-shared;
                vrf-table-label;
            }
            mac-vrf-leaf-2 {
                instance-type mac-vrf;
                protocols {
                    evpn {
                        encapsulation vxlan;
                        default-gateway no-gateway-community;
                        extended-vni-list all;
                        vni-options {
                            vni 10100 {
                                vrf-target target:10100:10100;
                            }
                            vni 10101 {
                                vrf-target target:10101:10101;
                            }
                            vni 10105 {
                                vrf-target target:10105:10105;
                            }
                        }
                    }
                }
                vtep-source-interface lo0.1;
                service-type vlan-aware;
                interface ge-0/0/3.0;
                route-distinguisher 192.168.3.2:1;
                vrf-target target:1:1;
                vlans {
                    v100 {
                        vlan-id 100;
                        l3-interface irb.110;
                        vxlan {
                            vni 10100;
                        }
                    }
                    v101 {
                        vlan-id 101;
                        l3-interface irb.111;
                        vxlan {
                            vni 10101;
                        }
                    }
                    v105 {
                        vlan-id 105;
                        l3-interface irb.115;
                        vxlan {
                            vni 10105;
                        }
                    }
                }
            }
        }
        routing-options {
            router-id 192.168.3.2;
            autonomous-system 65302;
            rib-groups {
                Tenant1_To_INET {
                    import-rib [ TENANT1-L3VRF-L2.inet.0 inet.0 ];
                    import-policy Tenant_to_inet;
                }
                Tenant2_To_INET {
                    import-rib [ TENANT2-L3VRF-L2.inet.0 inet.0 ];
                    import-policy Tenant_to_inet;
                }
            }
        }
    }
