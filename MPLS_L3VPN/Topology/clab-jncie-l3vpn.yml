        - bash -lc "ip route replace default via 8.8.8.1 dev eth1"


  links:
    # MX1
    - endpoints: ["mx1:eth1", "mx2:eth1"]
    - endpoints: ["mx1:eth2", "mx3:eth1"]
    - endpoints: ["mx1:eth3", "rr:eth1"]
    - endpoints: ["mx1:eth4", "cpe-hub:eth1"]
    - endpoints: ["mx1:eth5", "cpe-hub:eth2"]
    # MX2
    - endpoints: ["mx2:eth2", "mx3:eth2"]
    - endpoints: ["mx2:eth3", "cpe-2:eth1"]
    # MX3
    - endpoints: ["mx3:eth3", "cpe-3:eth1"]
    # CPE HUB
    - endpoints: ["cpe-hub:eth3", "DEB1:eth1"]
    - endpoints: ["cpe-hub:eth4", "INET_HOST:eth1"]
    # CPE 2
