name: junos-l3vpn-hub-spoke

topology:
  nodes:
    mx1:
      kind: juniper_vjunosrouter
      image: vrnetlab/juniper_vjunos-router:25.4R1.12
      startup-config: /home/jsullivan/clab-quickstart/clab-jncie-l3vpn/clab-junos-l3vpn-hub-spoke/mx1/config/MX1.conf
      enforce-startup-config: true

    mx2:
      kind: juniper_vjunosrouter
      image: vrnetlab/juniper_vjunos-router:25.4R1.12
      startup-config: /home/jsullivan/clab-quickstart/clab-jncie-l3vpn/clab-junos-l3vpn-hub-spoke/mx2/config/MX2.conf
      enforce-startup-config: true

    mx3:
      kind: juniper_vjunosrouter
      image: vrnetlab/juniper_vjunos-router:25.4R1.12
      startup-config: /home/jsullivan/clab-quickstart/clab-jncie-l3vpn/clab-junos-l3vpn-hub-spoke/mx3/config/MX3.conf
      enforce-startup-config: true

    rr:
      kind: juniper_vjunosrouter
      image: vrnetlab/juniper_vjunos-router:25.4R1.12
      startup-config: /home/jsullivan/clab-quickstart/clab-jncie-l3vpn/clab-junos-l3vpn-hub-spoke/rr/config/RR.conf
      enforce-startup-config: true

    cpe-hub:
      kind: juniper_vjunosrouter
      image: vrnetlab/juniper_vjunos-router:25.4R1.12
      startup-config: /home/jsullivan/clab-quickstart/clab-jncie-l3vpn/clab-junos-l3vpn-hub-spoke/cpe-hub/config/CPE-HUB.conf
      enforce-startup-config: true

    cpe-2:
      kind: juniper_vjunosrouter
      image: vrnetlab/juniper_vjunos-router:25.4R1.12
      startup-config: /home/jsullivan/clab-quickstart/clab-jncie-l3vpn/clab-junos-l3vpn-hub-spoke/cpe-2/config/CPE-2.conf
      enforce-startup-config: true

    cpe-3:
      kind: juniper_vjunosrouter
      image: vrnetlab/juniper_vjunos-router:25.4R1.12
      startup-config: /home/jsullivan/clab-quickstart/clab-jncie-l3vpn/clab-junos-l3vpn-hub-spoke/cpe-3/config/CPE-3.conf
      enforce-startup-config: true



    # DEB1 host
    DEB1:
      kind: linux
      image: ubuntu:22.04
      exec:
        - bash -lc "sleep 5"
        - bash -lc "apt update -y"
        - bash -lc "apt install -y isc-dhcp-client iproute2 iputils-ping tcpdump nano iperf3 ethtool net-tools vlan"
        - bash -lc "ip link set eth1 up || true"
        - bash -lc "modprobe 8021q"
        # VRF + VLAN 10
        - bash -lc "ip link add vrf10 type vrf table 10"
        - bash -lc "ip link set vrf10 up"
        - bash -lc "ip link add link eth1 name eth1.10 type vlan id 10"
        - bash -lc "ip link set eth1.10 master vrf10"
        - bash -lc "ip link set eth1.10 up"
        - bash -lc "ip addr add 172.1.10.10/24 dev eth1.10"
        - bash -lc "ip route add default via 172.1.10.1 dev eth1.10 vrf vrf10"
        # VRF + VLAN 20
        - bash -lc "ip link add vrf20 type vrf table 20"
        - bash -lc "ip link set vrf20 up"
        - bash -lc "ip link add link eth1 name eth1.20 type vlan id 20"
        - bash -lc "ip link set eth1.20 master vrf20"
        - bash -lc "ip link set eth1.20 up"
        - bash -lc "ip addr add 172.1.20.10/24 dev eth1.20"
        - bash -lc "ip route add default via 172.1.20.1 dev eth1.20 vrf vrf20"
        # VRF + VLAN 30
        - bash -lc "ip link add vrf30 type vrf table 30"
        - bash -lc "ip link set vrf30 up"
        - bash -lc "ip link add link eth1 name eth1.30 type vlan id 30"
        - bash -lc "ip link set eth1.30 master vrf30"
        - bash -lc "ip link set eth1.30 up"
        - bash -lc "ip addr add 172.1.30.10/24 dev eth1.30"
        - bash -lc "ip route add default via 172.1.30.1 dev eth1.30 vrf vrf30"

