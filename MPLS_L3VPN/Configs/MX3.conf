interfaces {
    ge-0/0/0 {
        description "To MX1";
        unit 0 {
            family inet {
                address 10.0.0.3/31;
            }
            family iso;
            family mpls;
        }
    }
    ge-0/0/1 {
        description "To MX2";
        unit 0 {
            family inet {
                address 10.0.0.5/31;
            }
            family iso;
            family mpls;
        }
    }
    ge-0/0/2 {
        description "To CPE-3";
        unit 0 {
            family inet {
                address 192.168.0.13/30;
            }
        }
    }
    fxp0 {
        unit 0 {
            family inet {
                address 10.0.0.15/24;
            }
            family inet6 {
                address 2001:db8::2/64;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 192.168.1.3/32;
            }
            family iso {
                address 49.0001.1921.6800.1003.00;
            }
            family mpls;
        }
    }
}
policy-options {
    policy-statement SPOKE-EXPORT {
        term 1 {
            from protocol [ direct bgp ];
            then {
                community set CUSTA-SPOKE;
                accept;
            }
        }
    }
    policy-statement SPOKE-IMPORT {
        term 1 {
            from {
                protocol bgp;
                community CUSTA-HUB;
            }
            then accept;
        }
        term 2 {
            then reject;
        }
    }
    policy-statement nh-self {
        term 1 {
            from protocol bgp;
            then {
                next-hop self;
                accept;
            }
        }
    }
    community CUSTA-HUB members target:999:100;
    community CUSTA-SPOKE members target:999:101;
    as-path CUSTA-ORIGIN ".* 65001";
    as-path CUSTA-ADJ "65001 .*";
    as-path TWO-HOP_LIMIT " .{2,}";
}
routing-instances {
    CPE-SPOKE {
        instance-type vrf;
        protocols {
            bgp {
                group CPE-SPOKE {
                    type external;
                    peer-as 65001;
                    as-override;
                    neighbor 192.168.0.14;
                }
                log-updown;
            }
        }
        interface ge-0/0/2.0;
        route-distinguisher 192.168.1.3:101;
        vrf-import SPOKE-IMPORT;
        vrf-export SPOKE-EXPORT;
    }
    mgmt_junos {
        routing-options {
            rib mgmt_junos.inet6.0 {
                static {
                    route ::/0 next-hop 2001:db8::1;
                }
            }
            static {
                route 0.0.0.0/0 next-hop 10.0.0.2;
            }
        }
    }
}
routing-options {
    autonomous-system 999;
}
protocols {
    bgp {
        group IBGP {
            type internal;
            local-address 192.168.1.3;
            log-updown;
            family inet {
                unicast;
            }
            family inet-vpn {
                unicast;
            }
            authentication-algorithm ao;
            authentication-key-chain jncie-bgp;
            export nh-self;
            neighbor 192.168.1.100;
        }
    }
    isis {
        interface ge-0/0/0.0 {
            point-to-point;
        }
        interface ge-0/0/1.0 {
            point-to-point;
        }
        interface lo0.0 {
            passive;
        }
        level 1 disable;
    }
    ldp {
        interface ge-0/0/0.0;
        interface ge-0/0/1.0;
        interface lo0.0;
    }
    mpls {
        label-switched-path MX3-To-MX2 {
            to 192.168.1.2;
            no-cspf;
            primary primary;
            secondary secondary {
                standby;
                adaptive;
            }
        }
        label-switched-path MX3-To-MX1 {
            to 192.168.1.1;
            no-cspf;
            primary primary;
            secondary secondary {
                standby;
                adaptive;
            }
        }
        path primary;
        path secondary;
        interface lo0.0;
        interface ge-0/0/0.0;
        interface ge-0/0/1.0;
    }
    rsvp {
        interface lo0.0;
        interface ge-0/0/0.0;
        interface ge-0/0/1.0;
    }
}
