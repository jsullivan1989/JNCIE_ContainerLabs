interfaces {
    ge-0/0/0 {
        description "Hub and Spoke interface";
        flexible-vlan-tagging;
        encapsulation flexible-ethernet-services;
        unit 110 {
            description "HUB Interface";
            vlan-id 110;
            family inet {
                address 192.168.0.2/30;
            }
        }
        unit 120 {
            description "SPOKE Interface";
            vlan-id 120;
            family inet {
                address 192.168.0.6/30;
            }
        }
    }
    ge-0/0/1 {
        description "To PE INET";
        unit 0 {
            family inet {
                address 192.168.0.18/30;
            }
        }
    }
    ge-0/0/2 {
        description DEB1;
        flexible-vlan-tagging;
        encapsulation flexible-ethernet-services;
        unit 10 {
            vlan-id 10;
            family inet {
                address 172.1.10.1/24;
            }
        }
        unit 20 {
            vlan-id 20;
            family inet {
                address 172.1.20.1/24;
            }
        }
        unit 30 {
            vlan-id 30;
            family inet {
                address 172.1.30.1/24;
            }
        }
    }
    ge-0/0/3 {
        description "To INET Simulated";
        unit 0 {
            family inet {
                address 8.8.8.1/24;
            }
        }
    }
    fxp0 {
        unit 0 {
            family inet {
                address 10.0.0.15/24;
            }
            family inet6 {
                address 2001:db8::2/64;
            }
        }
    }
}
policy-options {
    policy-statement DEFAULT_ONLY {
        term 1 {
            from {
                route-filter 0.0.0.0/0 exact;
            }
            then accept;
        }
        term 2 {
            then reject;
        }
    }
    policy-statement HUB-EXPORT {
        term 1 {
            from {
                protocol [ direct bgp ];
                route-filter 172.0.0.0/8 longer;
            }
            then accept;
        }
        term 2 {
            then reject;
        }
    }
    policy-statement NOTHING {
        then reject;
    }
    policy-statement SPOKE-To-HUB-LEAK {
        term 1 {
            from {
                instance SPOKE;
                protocol direct;
                route-filter 192.168.0.4/30 exact;
            }
            then accept;
        }
        term 2 {
            from {
                instance SPOKE;
                protocol bgp;
                route-filter 172.0.0.0/8 longer;
            }
            then accept;
        }
        term 3 {
            then reject;
        }
    }
}
routing-instances {
    HUB {
        instance-type virtual-router;
        routing-options {
            instance-import SPOKE-To-HUB-LEAK;
        }
        protocols {
            bgp {
                group PE-HUB {
                    advertise-peer-as;
                    log-updown;
                    import NOTHING;
                    export HUB-EXPORT;
                    peer-as 999;
                    as-override;
                    neighbor 192.168.0.1;
                }
            }
        }
        interface ge-0/0/0.110;
        interface ge-0/0/2.10;
        interface ge-0/0/2.20;
        interface ge-0/0/2.30;
    }
    INTERNET {
        instance-type virtual-router;
        routing-options {
            autonomous-system 8888;
            static {
                route 0.0.0.0/0 discard;
            }
        }
        protocols {
            bgp {
                group INET {
                    type external;
                    log-updown;
                    export DEFAULT_ONLY;
                    peer-as 999;
                    neighbor 192.168.0.17;
                }
            }
        }
        interface ge-0/0/1.0;
        interface ge-0/0/3.0;
    }
    SPOKE {
        instance-type virtual-router;
        protocols {
            bgp {
                group PE-SPOKE {
                    log-updown;
                    export NOTHING;
                    peer-as 999;
                    neighbor 192.168.0.5;
                }
            }
        }
        interface ge-0/0/0.120;
    }
    mgmt_junos {
        routing-options {
            rib mgmt_junos.inet6.0 {
                static {
                    route ::/0 next-hop 2001:db8::1;
                }
            }
            static {
                route 0.0.0.0/0 next-hop 10.0.0.2;
            }
        }
    }
}
routing-options {
    autonomous-system 65001;
}
