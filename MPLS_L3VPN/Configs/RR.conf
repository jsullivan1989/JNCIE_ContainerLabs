interfaces {
    ge-0/0/0 {
        description "To MX1";
        unit 0 {
            family inet {
                address 10.0.0.7/31;
            }
            family iso;
            family mpls;
        }
    }
    fxp0 {
        unit 0 {
            family inet {
                address 10.0.0.15/24;
            }
            family inet6 {
                address 2001:db8::2/64;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 192.168.1.100/32;
            }
            family iso {
                address 49.0001.1921.6800.1100.00;
            }
            family mpls;
        }
    }
}
routing-instances {
    mgmt_junos {
        routing-options {
            rib mgmt_junos.inet6.0 {
                static {
                    route ::/0 next-hop 2001:db8::1;
                }
            }
            static {
                route 0.0.0.0/0 next-hop 10.0.0.2;
            }
        }
    }
}
routing-options {
    autonomous-system 999;
}
protocols {
    bgp {
        group rr-clients {
            type internal;
            local-address 192.168.1.100;
            log-updown;
            family inet {
                unicast;
            }
            family inet-vpn {
                unicast;
            }
            authentication-algorithm ao;
            authentication-key-chain jncie-bgp;
            cluster 192.168.1.100;
            neighbor 192.168.1.1;
            neighbor 192.168.1.2;
            neighbor 192.168.1.3;
        }
    }
    isis {
        interface ge-0/0/0.0 {
            point-to-point;
        }
        interface lo0.0 {
            passive;
        }
        level 1 disable;
    }
    ldp {
        interface ge-0/0/0.0;
        interface lo0.0;
    }
    mpls {
        interface ge-0/0/0.0;
        interface lo0.0;
    }
}
