interfaces {
    ge-0/0/0 {
        description "To MX2";
        unit 0 {
            family inet {
                address 10.0.0.0/31;
            }
            family iso;
            family mpls;
        }
    }
    ge-0/0/1 {
        description "To MX3";
        unit 0 {
            family inet {
                address 10.0.0.2/31;
            }
            family iso;
            family mpls;
        }
    }
    ge-0/0/2 {
        description "To RR";
        unit 0 {
            family inet {
                address 10.0.0.6/31;
            }
            family iso;
            family mpls;
        }
    }
    ge-0/0/3 {
        flexible-vlan-tagging;
        encapsulation flexible-ethernet-services;
        unit 110 {
            description CPE-HUB;
            vlan-id 110;
            family inet {
                address 192.168.0.1/30;
            }
        }
        unit 120 {
            description CPE-SPOKE;
            vlan-id 120;
            family inet {
                address 192.168.0.5/30;
            }
        }
    }
    ge-0/0/4 {
        description "To INET";
        unit 0 {
            family inet {
                address 192.168.0.17/30;
            }
        }
    }
    fxp0 {
        unit 0 {
            family inet {
                address 10.0.0.15/24;
            }
            family inet6 {
                address 2001:db8::2/64;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 192.168.1.1/32;
            }
            family iso {
                address 49.0001.1921.6800.1001.00;
            }
            family mpls;
        }
    }
}
policy-options {
    policy-statement AGG_ONLY {
        term 1 {
            from {
                route-filter 172.0.0.0/8 exact;
            }
            then accept;
        }
        term 2 {
            then reject;
        }
    }
    policy-statement HUB-EXPORT {
        term 1 {
            from protocol [ direct bgp ];
            then {
                community set CUSTA-HUB;
                accept;
            }
        }
    }
    policy-statement INET_TO_CPE_HUB {
        term 1 {
            from {
                protocol direct;
                route-filter 192.168.0.16/30 exact;
            }
            then accept;
        }
        term 2 {
            from {
                protocol bgp;
                route-filter 0.0.0.0/0 exact;
            }
            then accept;
        }
        term 3 {
            then reject;
        }
    }
    policy-statement NO-EXPORT {
        then reject;
    }
    policy-statement NO-IMPORT {
        then reject;
    }
    policy-statement SPOKE-IMPORT {
        term 1 {
            from {
                protocol bgp;
                community CUSTA-SPOKE;
            }
            then accept;
        }
        term 2 {
            then reject;
        }
    }
    policy-statement nh-self {
        term 1 {
            from protocol bgp;
            then {
                next-hop self;
                accept;
            }
        }
    }
    community CUSTA-HUB members target:701:100;
    community CUSTA-SPOKE members target:701:101;
    as-path CUSTA-ORIGIN ".* 65001";
    as-path CUSTA-ADJ "65001 .*";
    as-path TWO-HOP_LIMIT " .{2,}";
}
routing-instances {
    CPE-HUB {
        instance-type vrf;
        protocols {
            bgp {
                group CPE-HUB {
                    type external;
                    export NO-EXPORT;
                    peer-as 65001;
                    as-override;
                    neighbor 192.168.0.2;
                }
                log-updown;
            }
        }
        interface ge-0/0/3.110;
        route-distinguisher 192.168.1.1:100;
        vrf-import NO-IMPORT;
        vrf-export HUB-EXPORT;
    }
    CPE-SPOKE {
        instance-type vrf;
        routing-options {
            aggregate {
                route 172.0.0.0/8 discard;
            }
        }
        protocols {
            bgp {
                group CPE-SPOKE {
                    type external;
                    import NO-IMPORT;
                    peer-as 65001;
                    as-override;
                    neighbor 192.168.0.6;
                }
                log-updown;
            }
        }
        interface ge-0/0/3.120;
        route-distinguisher 192.168.1.1:101;
        vrf-import SPOKE-IMPORT;
        vrf-export NO-EXPORT;
    }
    mgmt_junos {
        routing-options {
            rib mgmt_junos.inet6.0 {
                static {
                    route ::/0 next-hop 2001:db8::1;
                }
            }
            static {
                route 0.0.0.0/0 next-hop 10.0.0.2;
            }
        }
    }
}
routing-options {
    interface-routes {
        rib-group inet INET0_TO_HUB;
    }
    autonomous-system {
        701;
        loops 4;
    }
    static {
        route 172.0.0.0/8 next-table CPE-SPOKE.inet.0;
    }
    rib-groups {
        INET0_TO_HUB {
            import-rib [ inet.0 CPE-HUB.inet.0 ];
            import-policy INET_TO_CPE_HUB;
        }
    }
}
protocols {
    bgp {
        group IBGP {
            type internal;
            local-address 192.168.1.1;
            log-updown;
            family inet {
                unicast;
            }
            family inet-vpn {
                unicast;
            }
            authentication-algorithm ao;
            authentication-key-chain jncie-bgp;
            export nh-self;
            neighbor 192.168.1.100;
        }
        group INET {
            type external;
            log-updown;
            family inet {
                unicast {
                    rib-group INET0_TO_HUB;
                }
            }
            export AGG_ONLY;
            peer-as 8888;
            neighbor 192.168.0.18;
        }
    }
    isis {
        interface ge-0/0/0.0 {
            point-to-point;
        }
        interface ge-0/0/1.0 {
            point-to-point;
        }
        interface ge-0/0/2.0 {
            point-to-point;
        }
        interface lo0.0 {
            passive;
        }
        level 1 disable;
    }
    ldp {
        interface ge-0/0/2.0;
        interface lo0.0;
    }
    mpls {
        label-switched-path MX1-To-MX2 {
            to 192.168.1.2;
            ldp-tunneling;
            no-cspf;
            secondary secondary {
                standby;
                adaptive;
            }
        }
        label-switched-path MX1-To-MX3 {
            to 192.168.1.3;
            ldp-tunneling;
            no-cspf;
            primary primary;
            secondary secondary {
                standby;
                adaptive;
            }
        }
        path primary;
        path secondary;
        interface lo0.0;
        interface ge-0/0/0.0;
        interface ge-0/0/1.0;
        interface ge-0/0/2.0;
    }
    rsvp {
        interface lo0.0;
        interface ge-0/0/0.0;
        interface ge-0/0/1.0;
    }
}
